        file: retinaface_mobilenet25_mod_0_mpk.tar.gz
    unit:
      python: true
      cpp: true
    e2e:
      python:
        enabled: false
        reason: RetinaFace e2e is blocked by the current detess/dequant issue.
        models: []
      cpp:
