      cpp: false
    e2e:
      python:
        enabled: false
        reason: GenAI model assets and runtime coverage are not enabled for GA yet.
        models: []
      cpp:
        enabled: false
        reason: No C++ test coverage for this Python-only GenAI example.
        models: []

