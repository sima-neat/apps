<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiMa.ai GenAI Demo</title>
  <script src="static/socket.io.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='newui.css') }}">
  <script src="/config.js"></script>
</head>

<body class="{% if llm_only %}llm-only{% endif %}">

  <!-- Main Dashboard Container -->
  <div id="mainDashboard" class="dashboard">

    <!-- Top Section -->
    <div id="topSection" class="top-section">

      <!-- Top Left: Camera Feed -->
      <div id="cameraSection" class="camera-section">
        <img id="topCenterIcon" src="{{ url_for('static', filename='icons/logo.svg') }}" alt="SiMa.ai Logo">
        {% if model_name %}
        <div class="model-name-pill camera-pill" title="Active model">{{ model_name }}</div>
        {% endif %}
        <div class="camera-preview-container">
          <video id="cameraPreview" autoplay muted playsinline></video>
        </div>
        <!-- Snap Animation Image -->
        <img id="snapAnimation" src="" alt="Snap Animation" style="display: none;">
      </div>

      <!-- Top Right: Settings Panel -->
      <div id="settingsSection" class="settings-section">
        <div class="settings-header">
          Settings
          <button id="themeToggle" class="theme-toggle-button-header" title="Toggle Dark/Light Mode">
            <span class="theme-icon" id="themeIcon">🌙</span>
          </button>
        </div>
        <div class="settings-content">
          <!-- New Layout: Left and Right Containers -->
          <div class="settings-container-row">
            <!-- Left Container: Conversation & Voice -->
            <div class="settings-left-container">
              <div class="setting-group-title">Conversation Settings</div>
              <div class="setting-row" id="chatModelRow" style="display: none;">
                <label for="chatModelSelect" class="setting-label">
                  Model:
                </label>
                <select id="chatModelSelect" class="setting-select"></select>
              </div>
              <div class="setting-row">
                <label class="setting-label">
                  <input type="checkbox" id="toggleImagePrompt" checked>
                  Include image in the prompt
                </label>
              </div>
              <div class="setting-row">
                <label class="setting-label">
                  <input type="checkbox" id="toggleChatHistory">
                  Include chat history
                </label>
              </div>
              <div class="setting-row system-prompt-row">
                <button id="systemPromptButton" class="setting-button system-prompt-button">Set System Prompt</button>
              </div>
              <div class="setting-row" id="languageRow" style="display: none;">
                <label for="languageSelect" class="setting-label">
                  Transcription Language:
                </label>
                <select id="languageSelect" class="setting-select">
                  <option value="en" selected>English</option>
                  <option value="zh">Chinese</option>
                  <option value="de">German</option>
                  <option value="es">Spanish</option>
                  <option value="ru">Russian</option>
                  <option value="ko">Korean</option>
                  <option value="fr">French</option>
                  <option value="ja">Japanese</option>
                  <option value="pt">Portuguese</option>
                  <option value="tr">Turkish</option>
                  <option value="pl">Polish</option>
                  <option value="ca">Catalan</option>
                  <option value="nl">Dutch</option>
                  <option value="ar">Arabic</option>
                  <option value="sv">Swedish</option>
                  <option value="it">Italian</option>
                  <option value="id">Indonesian</option>
                  <option value="hi">Hindi</option>
                  <option value="fi">Finnish</option>
                  <option value="vi">Vietnamese</option>
                  <option value="he">Hebrew</option>
                  <option value="uk">Ukrainian</option>
                  <option value="el">Greek</option>
                  <option value="ms">Malay</option>
                  <option value="cs">Czech</option>
                  <option value="ro">Romanian</option>
                  <option value="da">Danish</option>
                  <option value="hu">Hungarian</option>
                  <option value="ta">Tamil</option>
                  <option value="no">Norwegian</option>
                  <option value="th">Thai</option>
                  <option value="ur">Urdu</option>
                  <option value="hr">Croatian</option>
                  <option value="bg">Bulgarian</option>
                  <option value="lt">Lithuanian</option>
                  <option value="la">Latin</option>
                  <option value="mi">Maori</option>
                  <option value="ml">Malayalam</option>
                  <option value="cy">Welsh</option>
                  <option value="sk">Slovak</option>
                  <option value="te">Telugu</option>
                  <option value="fa">Persian</option>
                  <option value="lv">Latvian</option>
                  <option value="bn">Bengali</option>
                  <option value="sr">Serbian</option>
                  <option value="az">Azerbaijani</option>
                  <option value="sl">Slovenian</option>
                  <option value="kn">Kannada</option>
                  <option value="et">Estonian</option>
                  <option value="mk">Macedonian</option>
                  <option value="br">Breton</option>
                  <option value="eu">Basque</option>
                  <option value="is">Icelandic</option>
                  <option value="hy">Armenian</option>
                  <option value="ne">Nepali</option>
                  <option value="mn">Mongolian</option>
                  <option value="bs">Bosnian</option>
                  <option value="kk">Kazakh</option>
                  <option value="sq">Albanian</option>
                  <option value="sw">Swahili</option>
                  <option value="gl">Galician</option>
                  <option value="mr">Marathi</option>
                  <option value="pa">Punjabi</option>
                  <option value="si">Sinhala</option>
                  <option value="km">Khmer</option>
                  <option value="sn">Shona</option>
                  <option value="yo">Yoruba</option>
                  <option value="so">Somali</option>
                  <option value="af">Afrikaans</option>
                  <option value="oc">Occitan</option>
                  <option value="ka">Georgian</option>
                  <option value="be">Belarusian</option>
                  <option value="tg">Tajik</option>
                  <option value="sd">Sindhi</option>
                  <option value="gu">Gujarati</option>
                  <option value="am">Amharic</option>
                  <option value="yi">Yiddish</option>
                  <option value="lo">Lao</option>
                  <option value="uz">Uzbek</option>
                  <option value="fo">Faroese</option>
                  <option value="ht">Haitian Creole</option>
                  <option value="ps">Pashto</option>
                  <option value="tk">Turkmen</option>
                  <option value="nn">Nynorsk</option>
                  <option value="mt">Maltese</option>
                  <option value="sa">Sanskrit</option>
                  <option value="lb">Luxembourgish</option>
                  <option value="my">Myanmar</option>
                  <option value="bo">Tibetan</option>
                  <option value="tl">Tagalog</option>
                  <option value="mg">Malagasy</option>
                  <option value="as">Assamese</option>
                  <option value="tt">Tatar</option>
                  <option value="haw">Hawaiian</option>
                  <option value="ln">Lingala</option>
                  <option value="ha">Hausa</option>
                  <option value="ba">Bashkir</option>
                  <option value="jw">Javanese</option>
                  <option value="su">Sundanese</option>
                  <option value="yue">Cantonese</option>
                </select>
              </div>

              <div class="setting-row voice-language-group" id="voiceRow">
                <label for="voiceSelect" class="setting-label">
                  English Voice:
                </label>
                <select id="voiceSelect" class="setting-select">
                  <option value="default" selected>Default</option>
                  <option value="htc_female">HTC Female</option>
                  <option value="ryan">Ryan</option>
                  <option value="amy">Amy</option>
                </select>
                <div id="voiceStatus" class="voice-status"></div>
              </div>
            </div>

            <!-- Right Container: RAG Controls -->
            <div class="settings-right-container">
              <div class="setting-group-title">RAG Settings</div>
              <div class="setting-row rag-toggle-row">
                <label class="setting-label">
                  <input type="checkbox" id="toggleRAG">
                  Search RAG Database
                </label>
              </div>
              <div class="setting-row button-row rag-button-row">
                <button id="uploadToRagButton" class="setting-button">Upload to RAG</button>
                <button id="importRagDatabaseButton" class="setting-button">Import RAG DB</button>
              </div>
              <div id="settingsMessage" class="settings-message"></div>
              <div id="ragStatus" class="rag-status"></div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Middle Section: Metrics -->
    <div id="metricsSection" class="metrics-section">
      <div class="metric-item">
        <div class="metric-value" id="transcribeTime">0s</div>
        <div class="metric-label">Transcribe</div>
      </div>
      <div class="metric-item">
        <div class="metric-value" id="firstTokenTime">0s</div>
        <div class="metric-label">First Token</div>
      </div>
      <div class="metric-item">
        <div class="metric-value" id="firstAudioTime">0s</div>
        <div class="metric-label">First Audio</div>
      </div>
      <div class="metric-item">
        <div class="metric-value" id="tpsValue">0</div>
        <div class="metric-label">TPS</div>
      </div>
      <div class="metric-item">
        <div class="metric-value" id="rtfValue">0</div>
        <div class="metric-label">RTF</div>
      </div>
    </div>

    <!-- Bottom Section: Chat Interface -->
    <div id="chatSection" class="chat-section">

      <!-- Chat Messages Area -->
      <div id="chatMessages" class="chat-messages">
        <!-- Messages will be dynamically added here -->
      </div>

      <!-- Overlay Buttons -->
      <button id="newChatButton" class="chat-overlay-button chat-overlay-top-right" title="New Chat">
        <img src="{{ url_for('static', filename='icons/refresh.png') }}" alt="New Chat" width="16" height="16">
      </button>

      <button id="abortButton" class="chat-overlay-button chat-overlay-bottom-right" title="Stop"
        style="display: none;">
        <img src="{{ url_for('static', filename='icons/cancel.png') }}" alt="Stop" width="16" height="16">
      </button>

      <!-- Chat Input Area -->
      <div id="chatInput" class="chat-input">
        <div class="input-container">
          <input type="text" id="messageInput" class="message-input" placeholder="Type your message...">
          <div class="input-buttons">
            <button id="sendButton" class="input-button" title="Send">
              <img src="{{ url_for('static', filename='icons/send.png') }}" alt="Send" width="24" height="24">
            </button>
            <button id="recordButton" class="input-button" title="Record Audio">
              <img id="recordIcon" src="{{ url_for('static', filename='icons/muted.png') }}" alt="Record" width="24"
                height="24">
            </button>
            <button id="snapChatButton" class="input-button" title="Take Photo">
              <img src="{{ url_for('static', filename='icons/snap.png') }}" alt="Snap" width="24" height="24">
            </button>
            <button id="uploadButton" class="input-button" title="Upload Image">
              <img src="{{ url_for('static', filename='icons/images.png') }}" alt="Upload" width="24" height="24">
            </button>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- Audio Visualizer (hidden by default, shown during TTS) -->
  <canvas id="audioVisualizer" width="320" height="320" style="display: none;"></canvas>

  <!-- Image Modal -->
  <div id="imageModal" class="image-modal" style="display: none;">
    <div class="image-modal-content">
      <img id="modalImage" class="modal-image" src="" alt="Enlarged view">
    </div>
  </div>

  <div id="systemPromptModal" class="system-prompt-modal" style="display: none;">
    <div class="system-prompt-modal-content">
      <h3 class="system-prompt-title">System Prompt</h3>
      <textarea id="systemPromptTextarea" class="system-prompt-textarea"
        placeholder="Enter a system prompt or leave empty to clear it."></textarea>
      <div id="systemPromptModalMessage" class="system-prompt-modal-message"></div>
      <div class="system-prompt-actions">
        <button id="systemPromptCancel" class="setting-button system-prompt-cancel">Cancel</button>
        <button id="systemPromptSave" class="setting-button system-prompt-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    window.recordIconUrls = Object.freeze({
      muted: "{{ url_for('static', filename='icons/muted.png') }}",
      active: "{{ url_for('static', filename='icons/microphone.png') }}"
    });
  </script>
  <script src="{{ url_for('static', filename='newui.js') }}"></script>
  <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
</body>

</html>
