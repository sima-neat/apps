source:
  rtsp_url: <rtsp-url-1>  # Example: rtsp://<rtsp-source-ip>:<port>/<stream-name>

model:
  path: <model-path>  # Example: assets/models/<model-pack>.tar.gz
  labels: examples/object-detection/yolo26-object-detector/common/coco_label.txt

inference:
  frames: 0
  min_score: 0.2
  nms_iou: 0.60
  max_detections: 24
  # classes:
  #   - person
  #   - car
  #   - truck

runtime:
  timeout_ms: 50000

insight:
  host: <insight-host-ip>  # Host running the Insight receiver/viewer.
  video_port: 9000
  metadata_port: 9100
  channel: 0

openai:
  enabled: true
  host: 127.0.0.1
  port: 9998
  model: gemma4
  max_tokens: 128
  interval_seconds: 3
  timeout_seconds: 30
  max_pending_requests: 1
  system_prompt: >-
    Write one sarcastic scene caption. Comment on the visible situation,
    not identity or appearance. Use 10 words or fewer. Avoid: darling,
    ordinary, riveting, seriously, wow, posed. No explanation.
