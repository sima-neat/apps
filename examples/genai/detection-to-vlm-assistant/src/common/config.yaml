webcam:                      # Browser webcam upload settings.
  target_fps: 30             # Requested browser capture/upload rate.
  upload_max_width: 640      # Scale inference JPEGs; preview stays full resolution.
  max_frame_bytes: 4194304   # Maximum JPEG frame payload (4 MiB).

model:                       # Detector model selection.
  path: <model-path>         # Example: models/<model-pack>.tar.gz
  labels: examples/genai/detection-to-vlm-assistant/src/common/coco_label.txt

inference:                   # Detection controls.
  frames: 0                  # Frame limit. 0 means run continuously.
  queue_depth: 4             # Bounded async input/output queue.
  internal_queue_depth: 2    # Async preprocess/inference stage handoffs.
  min_score: 0.25            # Keep low-score people for track recovery.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max detections to keep per frame.
  # classes:
  #   - person
  #   - car
  #   - truck

tracking:                    # Session-local motion tracking for people.
  high_score_threshold: 0.55 # High-confidence association threshold.
  new_track_threshold: 0.65  # Minimum score that can create a track.
  match_iou_threshold: 0.20  # IoU association threshold.
  center_distance_enabled: true
  max_center_distance: 1.5   # Normalized motion-association distance.
  velocity_momentum: 0.80    # Constant-velocity smoothing.
  max_missing_frames: 30     # Preserve identity through short occlusions.
  min_confirmed_hits: 3      # Confirm before considering a VLM crop.
  max_active_tracks: 32
  description_edge_margin_ratio: 0.03 # Keep boxes 3% inside the top and sides.
  description_min_clear_frames: 5     # Require five consecutive clear frames.

runtime:                     # Runtime settings.
  timeout_ms: 50000          # Inference timeout in milliseconds.

web:                         # Browser-first demo dashboard.
  enabled: true
  host: 0.0.0.0
  port: 5000
  title: Real-Time Semantic People Tracker
  tls:
    enabled: true
    cert: <tls-server-cert-path>
    key: <tls-server-key-path>
    ca_cert: <tls-ca-cert-path>

genai_server:                # Local GenAI server process.
  host: 0.0.0.0              # Host interface to bind.
  port: 9998                 # Server port.
  model:                     # Vision-language model served locally.
    name: Gemma-4-E2B-it-GPTQ-a16w4
    path: /media/nvme/llima/models/gemma-4-E2B-it-GPTQ-a16w4

genai:                       # One-shot appearance descriptions for new tracks.
  enabled: true              # Enable semantic track descriptions.
  host: 127.0.0.1            # GenAI server client host.
  port: 9998                 # GenAI server client port.
  max_tokens: 64             # Preserve the complete enriched attribute line.
  timeout_seconds: 30        # Request timeout in seconds.
  max_pending_requests: 8    # Bounded queue of new tracks awaiting description.
