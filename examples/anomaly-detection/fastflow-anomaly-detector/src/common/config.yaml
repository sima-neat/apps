# FastFlow anomaly detection of one RTSP stream, with the defects outlined in Insight.
model:
  # fastflow_demo, the Model Zoo package trained on the blue discs, or anomalib, a package
  # compiled from an anomalib FastFlow export, which normalizes inside its graph.
  id: fastflow_demo
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/fastflow_demo_mpk.tar.gz

input:
  source: rtsp://<rtsp-source-ip>:<port>/<stream-name>  # RTSP URL of a stream with square frames.
  codec: h264                   # h264, h265, or mjpeg.
  width: 0                      # 0 reads the stream's frame size and rate with a probe. Set them
  height: 0                     # only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Frames to process before stopping; 0 runs until stopped.
  max_detections: 10            # Defect regions sent per frame, highest score first.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Insight video port.
    metadata_port_base: 9100    # Insight metadata port.

app:
  anomaly_threshold: 0.5        # Map probability at which a pixel counts as anomalous.
  # Smallest connected region, in map pixels, that counts as a defect: smaller ones are the
  # speckle a good part produces. Measured on the blue discs; measure again for each product.
  min_region_px: 300
