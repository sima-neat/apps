model:                                         # PatchCore feature-extractor model selection.
  path: models/patchcore_wide_resnet50_2_bf16_mla.tar.gz

source:
  type: video_file
  image_dir: assets/datasets/patchcore/images   # Used when type=image_dir.
  video_path: assets/datasets/patchcore/video/test.mp4
  rtsp:                                          # Used when type=rtsp.
    url: ""                                     # Required for type=rtsp, e.g. rtsp://<host>:8554/<stream>.
    codec: h264                                 # h264, h265, or mjpeg.
    tcp: true                                   # RTSP transport; set false for a UDP-only source.
    latency_ms: 200                             # RTSP receive latency in milliseconds.
    width: 0                                    # Only needed for h265/mjpeg; leave 0 for h264.
    height: 0                                   # Only needed for h265/mjpeg; leave 0 for h264.

memory_bank:                                    # Host-side kNN reference set (not part of the compiled graph).
  path: sandbox/patchcore-anomaly-detector/memory_bank.npy       # Coreset, written by --calibrate.
  meta_path: sandbox/patchcore-anomaly-detector/bank_meta.json   # Model hash, coreset stats, and threshold.

calibration:                                    # Used only by --calibrate.
  nominal_images_dir: assets/datasets/patchcore/nominal   # Shipped demo set (16 real known-good images);
                                                 # point this at your own inspection target's known-good images.
  coreset_ratio: 0.0004                         # Fraction of nominal patches kept via greedy k-center.
                                                 # Smaller = faster score() but a coarser bank; recalibrate
                                                 # (--calibrate) after changing this. Tuned for the shipped
                                                 # 16-image nominal set (12544 total patches) to keep the
                                                 # bank near the same size (~5 vectors) validated for
                                                 # >25fps on video/rtsp; a larger nominal set at this same
                                                 # ratio scales the bank size (and per-frame cost) with it.
  seed: 0
  threshold_percentile: 99.0                    # Decision threshold = this percentile of nominal scores.
  threshold_images_dir: ""                      # Optional held-out nominal set; "" reuses nominal_images_dir.
  threshold_margin: 1.2                         # Multiplier on top of the percentile threshold. The percentile
                                                 # alone is capped by the highest score already present in the
                                                 # nominal set, so it cannot absorb score inflation from sources
                                                 # calibration never sees -- e.g. the unavoidable RGB<->YUV
                                                 # rounding a video/RTSP source introduces even losslessly, which
                                                 # this shipped nominal set's tight bank (coreset_ratio above)
                                                 # has almost no headroom for. 1.0 = no margin.

scoring:
  num_neighbors: 9                              # Neighborhood-reweighting support-set size (paper Eq. 7-8).
  gaussian_sigma: 4.0                           # Anomaly-map smoothing sigma, in output pixels.

output:
  dir: sandbox/patchcore-anomaly-detector        # Folder for annotated overlay images.
  save_every: 60
  overlay_alpha: 0.45                           # Heatmap blend weight in the output overlay image.
  insight:                                      # video_file/rtsp only: live view.
    host: "192.168.130.129"
    video_port: 9000
    channel: 0                                  # Insight channel index.
    bitrate_kbps: 4000                          # H.264 encoder bitrate for the pushed video stream.

runtime:
  timeout_ms: 15000                             # Per-frame model-inference timeout (rtsp's own frame wait retries
                                                 # indefinitely on a network stall or startup delay instead of giving up).
  frames: 0                                     # video_file/rtsp frame limit; 0 = run until the source ends.
  profile: false                                # Reserved for future per-stage profiling output.
