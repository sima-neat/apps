# PatchCore anomaly detection of one RTSP stream, with the defects outlined in Insight.
model:
  # Compiled wide_resnet50_2 patch-feature extractor; a relative path starts at this file.
  path: ../../../../../models/patchcore_wide_resnet50_2_bf16_mla.tar.gz

input:
  # rtsp or image_dir. For image_dir, delete codec, width, height, fps, and rtsp, and set
  # source to a folder of images; the outlined images go to output.dir.
  type: rtsp
  source: rtsp://<rtsp-source-ip>:<port>/<stream-name>  # RTSP URL of the stream to inspect.
  codec: h264                   # h264, h265, or mjpeg.
  width: 0                      # 0 reads the stream's frame size and rate with a probe. Set them
  height: 0                     # only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Frames to process before stopping; 0 runs until stopped.
  max_detections: 10            # Defect regions sent per frame, highest score first.

output:
  dir: sandbox/patchcore-anomaly-detector  # image_dir only: folder for the outlined images.
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Insight video port.
    metadata_port_base: 9100    # Insight metadata port.

app:
  # Folder --calibrate writes memory_bank.npy and bank_meta.json to, and a run reads them from.
  memory_bank_dir: sandbox/patchcore-anomaly-detector/bank
  # Known-good images of the part, taken with the camera, framing, and lighting you run with.
  # --calibrate keeps every 5th one out of the bank to measure the thresholds.
  nominal_images_dir: assets/datasets/patchcore/nominal
  # Fraction of nominal patches the bank keeps. 0.0004 keeps 4 of the demo's 10,192; raise it
  # for a busy or varied scene. Scoring time per frame grows with the bank.
  coreset_ratio: 0.0004
  # Percentile of nominal scores that sets the frame verdict threshold and, over nominal
  # patches, the threshold at which a region is outlined.
  threshold_percentile: 99.0
  threshold_margin: 1.2         # Multiplier on both thresholds, as headroom for live video.
