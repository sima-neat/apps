model:                       # Depth model selection.
  path: <model-path>         # Example: models/depth_anything_v2_small/w8a8_mixed/depth_anything_v2_small_w8a8_mixed_mpk.tar.gz

io:                          # Input and output paths.
  input_dir: assets/datasets/coco       # Folder containing input images.
  output_dir: sandbox/depth-estimator # Folder for depth visualizations.

runtime:                     # Runtime settings. Neat reads the model input size from the package.
  max_input_size: 1920       # Larger images are downscaled to this side first.
  queue_depth: 4             # Runtime queue depth.
