model:                       # Detector model selection.
  path: <model-path>         # Example: models/<model-pack>.tar.gz

streams:                     # RTSP inputs, one entry per camera.
  - <rtsp-url-1>             # Example: rtsp://<rtsp-source-ip>:<port>/<stream-name>
  - <rtsp-url-2>
  - <rtsp-url-3>
  - <rtsp-url-4>

input:                       # RTSP input transport settings.
  codec: h264                # h264/avc or h265/hevc.
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.

runtime:                     # Runtime and profiling settings.
  profile: true              # Print per-stream timing summaries.
  warmup_frames: 30          # Drain this many frames before metadata/profile output.

inference:                   # Detection controls.
  frames: 0                  # Frame limit per stream. 0 means unlimited.
  fps: 0                     # Max per-stream processing and output FPS. 0 means use source FPS.
  max_inflight_per_stream: 4 # Raw decoder-backed frames admitted per stream to the shared detector.
  max_inflight_total: 16     # Raw decoder-backed frames admitted across all detector streams.
  min_score: 0.10            # Detector score floor. Must be <= every class low_score_threshold.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max detections to keep per frame after NMS.

tracking:                    # ByteTrack-style tracker, one instance per class per stream.
  classes:                   # 1 to 5 entries. `class` is a COCO name or id; other keys are optional.
    - class: person
      high_score_threshold: 0.50    # Detections at or above this score start matching (stage 1).
      low_score_threshold: 0.10     # Detections between low and high only recover active tracks (stage 2).
      new_track_threshold: 0.60     # Minimum score to start a new track.
      match_iou_threshold: 0.20     # Minimum IoU for high-score and tentative matches.
      low_match_iou_threshold: 0.50 # Minimum IoU for low-score recovery matches.
      max_missing_frames: 30        # Frames a lost track can wait to be re-matched.
      min_confirmed_hits: 2         # Matches before a new track is published.
      position_noise: 0.05          # Kalman position noise, relative to box height.
      velocity_noise: 0.00625       # Kalman velocity noise, relative to box height.
    - class: car
      match_iou_threshold: 0.15     # Faster motion leaves less box overlap between frames.
      max_missing_frames: 45
      velocity_noise: 0.0125        # Let the velocity estimate adapt faster.

output:                      # Insight output plus optional local debug saves.
  insight:                   # Live video and metadata destination.
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port_base: 9000    # Base UDP port for video channels.
    metadata_port_base: 9100 # Base UDP port for metadata channels.
  video_enabled: true        # Disable to publish metadata only.
  debug_dir: null            # Optional directory for periodic debug frame saves.
  save_every: 0              # Save every Nth debug frame. 0 disables saving.
  detections_log: null       # Optional path prefix; writes raw detections as <prefix>.stream<N>.jsonl.

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    output:
      save_every: 10
      total_saved_frames: 20
