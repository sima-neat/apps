model:
  # Custom one-class YOLO26n-P2 INT8 QAT pack. It must expose grouped raw
  # bbox heads followed by class-logit heads for P2, P3, P4, and P5.
  path: models/yolo26n_p2_tiny_drone_int8_qat_b1_mpk.tar.gz

streams:
  - <tiny-drone-rtsp-url>

input:
  tcp: true
  latency_ms: 100

runtime:
  profile: true
  warmup_frames: 30
  overflow_policy: keep_latest

inference:
  frames: 0
  fps: 0
  max_inflight_per_stream: 4
  max_inflight_total: 4
  num_classes: 1
  target_class_id: 0
  target_label: drone
  min_score: 0.05
  nms_iou: 0.60
  max_detections: 100

tracking:
  high_score_threshold: 0.20
  new_track_threshold: 0.30
  match_iou_threshold: 0.05
  max_center_distance: 0.50
  velocity_momentum: 0.90
  box_smoothing_alpha: 0.50
  camera_motion_compensation: true
  max_missing_frames: 30
  min_confirmed_hits: 2
  max_prediction_frames: 1

output:
  insight:
    host: <insight-host-ip>
    video_port_base: 9000
    metadata_port_base: 9100
  video_enabled: true
  debug_dir: null
  save_every: 0
