model:                       # Detector model selection.
  path: <model-path>         # Example: models/<model-pack>.tar.gz

streams:                     # RTSP inputs, one entry per camera.
  - <rtsp-url-1>             # Example: rtsp://<rtsp-source-ip>:<port>/<stream-name>
  - <rtsp-url-2>
  - <rtsp-url-3>
  - <rtsp-url-4>

input:                       # RTSP input transport settings.
  codec: h264                # h264/avc or h265/hevc.
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.

runtime:                     # Runtime and profiling settings.
  profile: true              # Print per-stream timing summaries.
  warmup_frames: 30          # Drain this many frames before metadata/profile output.
  overflow_policy: keep_latest # keep_latest for live streams; block for single-stream accuracy.

inference:                   # Detection controls.
  frames: 0                  # Frame limit per stream. 0 means unlimited.
  fps: 0                     # Max per-stream processing and output FPS. 0 means use source FPS.
  max_inflight_per_stream: 4 # Raw decoder-backed frames admitted per stream to the shared detector.
  max_inflight_total: 16     # Raw decoder-backed frames admitted across all detector streams.
  num_classes: 80            # Detector class count; must match the YOLO26 class-head depth.
  target_class_id: 0         # Class id to track. COCO id 0 is person.
  target_label: person       # Label emitted in Insight metadata.
  min_score: 0.30            # Decoder floor; lower it only when recovery tracking is needed.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max detections to keep per frame after NMS.

tracking:                    # Per-stream tracker settings.
  high_score_threshold: 0.30 # First association stage threshold.
  new_track_threshold: 0.30  # Minimum score allowed to establish a track.
  match_iou_threshold: 0.10  # Accept a match at or above this IoU.
  max_center_distance: 2.5   # Or accept by center distance, normalized by box diagonal.
  velocity_momentum: 0.80    # Velocity adaptation; covariance mode bounds excessive inertia.
  box_smoothing_alpha: 1.0   # Presentation-only smoothing. 1 publishes the filter posterior.
  covariance_motion_enabled: true # Use covariance-aware center/size motion and gating.
  overlap_threshold: 0.20    # Overlap coefficient that begins ambiguous-occlusion handling.
  max_occlusion_frames: 10   # Publish an occluded identity while it coasts; <= max_missing_frames.
  max_active_tracks: 128     # Hard bound for association memory and worst-case runtime.
  max_missing_frames: 15     # Frames to keep a missing track alive.
  min_confirmed_hits: 1      # Matches required before publishing a track.
  max_prediction_frames: 0   # Publish motion prediction over short detector gaps. 0 disables it.

output:                      # Insight output plus optional local debug saves.
  insight:                   # Live video and metadata destination.
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port_base: 9000    # Base UDP port for video channels.
    metadata_port_base: 9100 # Base UDP port for metadata channels.
  video_enabled: true        # Disable to publish metadata only.
  debug_dir: null            # Optional directory for periodic debug frame saves.
  save_every: 0              # Save every Nth debug frame. 0 disables saving.
  replay_dir: null           # Optional exact detector/transform/tracker JSONL capture directory.

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    output:
      save_every: 10
      total_saved_frames: 20
