model:                       # Detector model selection.
  path: assets/models/yolo26m-det-int8-b1.tar.gz
  labels: examples/object-detection/16-stream-object-detector/src/common/coco_label.txt

streams:                     # RTSP inputs, one entry per camera.
  - <rtsp-url-1>             # Example: rtsp://<rtsp-source-ip>:<port>/<stream-name>
  - <rtsp-url-2>
  - <rtsp-url-3>
  - <rtsp-url-4>

input:                       # RTSP input transport settings.
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.

runtime:                     # Runtime and profiling settings.
  profile: true              # Print per-stream timing summaries.
  warmup_frames: 30          # Drain this many frames before metadata/profile output.

inference:                   # Detection controls.
  workers: 4                 # Detector worker count. Must be 1..number of streams.
  min_score: 0.55            # Detection score threshold.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max detections to keep per frame after NMS.

output:                      # Insight output plus optional local debug saves.
  insight:                   # Live video and metadata destination.
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port_base: 9000    # Base UDP port for video channels.
    metadata_port_base: 9100 # Base UDP port for metadata channels.
  video_enabled: true        # Disable to publish metadata only.
  debug_dir: null            # Optional directory for periodic debug frame saves.
  save_every: 0              # Save every Nth debug frame. 0 disables saving.

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    runtime:
      warmup_frames: 0
    output:
      save_every: 10
      total_saved_frames: 20
