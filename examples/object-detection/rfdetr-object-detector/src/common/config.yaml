model:                          # RF-DETR model selection and artifacts.
  variant: small                # Select small or medium.
  labels: examples/object-detection/rfdetr-object-detector/src/common/coco-labels.txt # Sparse COCO labels.
  small:
    backbone: models/rfdetr-small-backbone.tar.gz       # Small first stage.
    transformer: models/rfdetr-small-transformer.tar.gz # Small second stage.
    input_size: 512             # Compiled square input size.
  medium:
    backbone: models/rfdetr-medium-backbone.tar.gz       # Medium first stage.
    transformer: models/rfdetr-medium-transformer.tar.gz # Medium second stage.
    input_size: 576             # Compiled square input size.

source:                         # H.264, H.265, or MJPEG RTSP source properties.
  rtsp_url: rtsp://<rtsp-source-ip>:<port>/<stream-name> # Input stream URL.
  codec: h264                   # h264/avc, h265/hevc, or mjpeg/jpeg.
  tcp: true                     # Use RTSP over TCP.
  latency_ms: 100               # RTSP receive latency.
  width: 0                      # Optional width fallback. 0 uses the probe.
  height: 0                     # Optional height fallback. 0 uses the probe.
  fps: 0                        # Optional FPS override. 0 uses the probe.

inference:                      # Detection output settings.
  frames: 0                    # 0 runs continuously.
  min_score: 0.5               # Minimum confidence to publish.
  max_detections: 100          # Maximum objects per frame.

output:                         # Insight channel 0 destination.
  insight:
    host: <insight-host-ip>     # Insight host reachable from the target.
    video_port: 9000            # H.264 video ingest port.
    metadata_port: 9100         # Object metadata ingest port.
