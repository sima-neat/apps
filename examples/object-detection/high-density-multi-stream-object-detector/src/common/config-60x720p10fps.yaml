# Profile: 60 streams of 720p at 10 FPS.
model:
  path: <model-path>            # Compiled model package; relative paths start at this file.
  labels: support/labels/coco80.txt  # The 80 COCO classes; relative to the working directory.

input:
  source:                       # One RTSP URL per stream; the same URL may repeat.
    - <rtsp-url-1>
    - <rtsp-url-2>
    - <rtsp-url-3>
    - <rtsp-url-4>
    - <rtsp-url-5>
    - <rtsp-url-6>
    - <rtsp-url-7>
    - <rtsp-url-8>
    - <rtsp-url-9>
    - <rtsp-url-10>
    - <rtsp-url-11>
    - <rtsp-url-12>
    - <rtsp-url-13>
    - <rtsp-url-14>
    - <rtsp-url-15>
    - <rtsp-url-16>
    - <rtsp-url-17>
    - <rtsp-url-18>
    - <rtsp-url-19>
    - <rtsp-url-20>
    - <rtsp-url-21>
    - <rtsp-url-22>
    - <rtsp-url-23>
    - <rtsp-url-24>
    - <rtsp-url-25>
    - <rtsp-url-26>
    - <rtsp-url-27>
    - <rtsp-url-28>
    - <rtsp-url-29>
    - <rtsp-url-30>
    - <rtsp-url-31>
    - <rtsp-url-32>
    - <rtsp-url-33>
    - <rtsp-url-34>
    - <rtsp-url-35>
    - <rtsp-url-36>
    - <rtsp-url-37>
    - <rtsp-url-38>
    - <rtsp-url-39>
    - <rtsp-url-40>
    - <rtsp-url-41>
    - <rtsp-url-42>
    - <rtsp-url-43>
    - <rtsp-url-44>
    - <rtsp-url-45>
    - <rtsp-url-46>
    - <rtsp-url-47>
    - <rtsp-url-48>
    - <rtsp-url-49>
    - <rtsp-url-50>
    - <rtsp-url-51>
    - <rtsp-url-52>
    - <rtsp-url-53>
    - <rtsp-url-54>
    - <rtsp-url-55>
    - <rtsp-url-56>
    - <rtsp-url-57>
    - <rtsp-url-58>
    - <rtsp-url-59>
    - <rtsp-url-60>
  codec: h264                   # h264 or h265, for every stream.
  width: 0                      # 0 reads each stream's frame size with a probe. Set a size
  height: 0                     # only for a stream that does not report one.
  fps: 10                       # Frames per second of every stream.
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 110             # RTSP jitter buffer.

inference:
  min_score: 0.30               # Lowest score a detection needs.
  nms_iou: 0.60                 # Overlap at which NMS drops the weaker box.
  max_detections: 50            # Boxes kept per frame.
  max_inflight_per_stream: 1    # Frames of one stream the model holds at once.
  max_inflight_total: 8         # Frames of all streams the model holds at once.

output:
  video_enabled: true           # Send each stream's video to Insight; false sends only boxes.
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Stream i sends video to this port + i.
    metadata_port_base: 9100    # Stream i sends boxes to this port + i.

app:
  decoder_buffers: 4            # Decoded frames each stream's decoder keeps.
  queue_depth: 1                # Detections waiting to be sent, and the run's queue depth.
  internal_queue_depth: 2       # Frames queued between the model's stages.
