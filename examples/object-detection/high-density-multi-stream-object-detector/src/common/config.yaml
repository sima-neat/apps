# Default profile: 16 x 720p @ 25 FPS.
# Relative model and label paths are resolved from this file.
model:
  path: <model-path>
  labels: coco_label.txt
  decode_type: yolo26

streams:
  - rtsp://192.168.1.9:25689/src1
  - rtsp://192.168.1.9:25689/src2
  - rtsp://192.168.1.9:25689/src3
  - rtsp://192.168.1.9:25689/src4
  - rtsp://192.168.1.9:25689/src5
  - rtsp://192.168.1.9:25689/src6
  - rtsp://192.168.1.9:25689/src7
  - rtsp://192.168.1.9:25689/src8
  - rtsp://192.168.1.9:25689/src9
  - rtsp://192.168.1.9:25689/src10
  - rtsp://192.168.1.9:25689/src11
  - rtsp://192.168.1.9:25689/src12
  - rtsp://192.168.1.9:25689/src13
  - rtsp://192.168.1.9:25689/src14
  - rtsp://192.168.1.9:25689/src15
  - rtsp://192.168.1.9:25689/src16

input:
  tcp: true
  latency_ms: 100
  drop_on_latency: true
  skip_rtsp_probe: true
  width: 1280
  height: 720
  fps: 25
  decoder_buffers: 8
  decoder_input_buffers: 2
  decoder_tuning: auto

runtime:
  profile: false
  warmup_frames: 30
  initial_detection_timeout_ms: 90000

inference:
  workers: 1
  queue_depth: 16
  internal_queue_depth: 1
  max_inflight_per_stream: 1
  max_inflight_total: 8
  min_score: 0.30
  nms_iou: 0.60
  max_detections: 50

output:
  insight:
    host: 192.168.1.9
    video_port_base: 9000
    metadata_port_base: 9100
    max_visible_streams: 16
  video_enabled: true
