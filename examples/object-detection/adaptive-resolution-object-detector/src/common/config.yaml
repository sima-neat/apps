mode: live                   # live, scale, or group. See the README for the trade-offs.

model:
  path: <model-path>         # Example: models/<model-pack>.tar.gz
  labels: examples/object-detection/adaptive-resolution-object-detector/src/common/coco_label.txt

source:                      # Settings shared by every stream.
  type: rtsp                 # rtsp only.
  codec: h264                # h264/avc only.
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.
  fps: 0                     # 0 probes each stream's FPS. Set it when a source does not report one.

streams:
  max_streams: 16            # Insight channels reserved for this run. Live edits cannot exceed it.
  sources:                   # One entry per stream. Copy each URL from Insight's Media Sources.
    - id: cam-1              # Unique, stable name. Live mode diffs config edits by id.
      url: <rtsp-url-1>      # Example: rtsp://<rtsp-source-ip>:<port>/<stream-name>
    - id: cam-2
      url: <rtsp-url-2>

group:
  size: 4                    # Streams per process in group mode. Ignored by live and scale.

inference:
  frames: 0                  # Frame limit per stream. 0 means run continuously.
  fps: 0                     # Max detections published per stream per second. 0 follows the source.
  min_score: 0.30            # Detection score threshold.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max detections kept per frame after NMS.

runtime:
  profile: false             # Print per-stream timing summaries.
  warmup_frames: 30          # Detections dropped per stream before metadata is published.
  config_watch_seconds: 1.0  # Live and group mode: how often streams.sources is checked for edits.

output:
  save_dir: ""               # Optional directory for annotated frames.
  save_every: 0              # Save every Nth output frame per stream. 0 disables saving.
  video_enabled: true        # Set false to publish metadata only.
  insight:
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port: 9000         # Base UDP video port. Stream on channel N uses video_port + N.
    metadata_port: 9100      # Base UDP metadata port. Stream on channel N uses metadata_port + N.

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    output:
      save_every: 10
      total_saved_frames: 20
