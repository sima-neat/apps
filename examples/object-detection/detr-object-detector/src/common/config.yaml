# DETR object detection of a folder of images, saved as annotated PNGs.
model:
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/detr_resnet_50/w16a16/detr_resnet_50_w16a16_mpk.tar.gz
  # The 91 COCO class IDs DETR scores, one label per line, N/A for the unused IDs; a relative
  # path starts at the working directory.
  labels: examples/object-detection/detr-object-detector/src/common/coco_labels.txt

input:
  source: assets/datasets/coco  # Folder of .jpg, .jpeg, .png, and .bmp images.

inference:
  min_score: 0.70               # Lowest score a detection needs.
  max_detections: 50            # Boxes kept per image.

output:
  dir: sandbox/detr-object-detector  # Folder for the annotated PNGs.
