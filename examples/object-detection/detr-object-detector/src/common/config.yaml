model:                       # DETR model selection.
  path: <model-path>         # Example: models/detr_resnet_50/w16a16/detr_resnet_50_w16a16_mpk.tar.gz

io:                          # Input and output paths.
  input_dir: assets/datasets/coco              # Folder containing input images.
  output_dir: sandbox/detr-object-detector   # Folder for annotated images.

decode:                      # Neat DETR decoder settings.
  confidence_threshold: 0.70 # Minimum object confidence, above 0 and at most 1.
  max_draw: 50               # Max detections per image, at least 1.
  person_only: false         # Keep only COCO person detections when true.

runtime:                     # Runtime settings.
  profile: false             # Time the model on the first image instead of annotating the folder.
  num_runs: 100              # Number of timed runs when profile is true.
