# PCB defect detection over a folder of images with a custom YOLO26n model.
model:
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/yolo26n_plc_mpk.tar.gz
  # Defect classes in the model's class order, one per line; a relative path starts at the
  # working directory.
  labels: examples/object-detection/pcb-defect-detector/src/common/pcb_label.txt

input:
  source: assets/datasets/pcb   # Folder of .jpg, .jpeg, .png, or .bmp images.

inference:
  min_score: 0.25               # Lowest score a defect needs.
  nms_iou: 0.45                 # Overlap at which NMS drops the weaker box.
  max_detections: 300           # Defects kept per image.

output:
  dir: sandbox/pcb-defect-detector  # Folder for the annotated images; not input.source.

app:
  input_max_width: 3840         # Largest image the model accepts; a larger image fails.
  input_max_height: 2160        # Raise both for larger scans.
