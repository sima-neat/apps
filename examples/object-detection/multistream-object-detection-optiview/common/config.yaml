model:  # Detector model selection.
  path: assets/models/yolo_v8m_mpk.tar.gz  # Path to the YOLOv8 model pack.
  family: yolov8  # Keep this as yolov8 for this example.

streams:  # RTSP inputs, one entry per camera.
  - <rtsp-url-1>
  - <rtsp-url-2>
  - <rtsp-url-3>
  - <rtsp-url-4>
  # - <rtsp-url-5>
  # - <rtsp-url-6>
  # - <rtsp-url-7>
  # - <rtsp-url-8>
  # - <rtsp-url-9>
  # - <rtsp-url-10>
  # - <rtsp-url-11>
  # - <rtsp-url-12>
  # - <rtsp-url-13>
  # - <rtsp-url-14>
  # - <rtsp-url-15>
  # - <rtsp-url-16>

input:  # RTSP input transport settings.
  tcp: true  # Use TCP for RTSP transport.
  latency_ms: 100  # RTSP receive latency in milliseconds.

runtime:  # Shared worker and profiling settings.
  worker_count: 4  # Number of detector workers shared across streams.
  mailbox_depth: 1  # Keep-latest queue depth per stream.
  profile: true  # Print per-stream timing summaries.

inference:  # Detection controls.
  frames: 0  # Frame limit per stream. 0 means unlimited.
  fps: 0  # Max per-stream processing and output FPS. 0 means use source FPS.
  min_score: 0.60  # Detection score threshold.
  nms_iou: 0.50  # NMS IoU threshold.
  max_detections: 24  # Max detections to keep per frame after NMS.

output:  # OptiView output plus optional local debug saves.
  optiview:  # Live video and JSON destination.
    host: <optiview-host>  # Host running the OptiView receiver/viewer.
    video_port_base: 9000  # Base UDP port for video channels.
    json_port_base: 9100  # Base UDP port for JSON channels.
  video_enabled: true  # Disable to publish JSON only.
  video_mode: annotated  # clean encodes decoded frames + JSON; annotated draws detections before encode.
  debug_dir: null  # Optional directory for periodic debug frame saves.
  save_every: 0  # Save every Nth debug frame. 0 disables saving.
