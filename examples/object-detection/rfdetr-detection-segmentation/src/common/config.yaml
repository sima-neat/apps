model:                          # Select one RF-DETR task and its model pair.
  task: detection               # detection or segmentation.
  labels: examples/object-detection/rfdetr-detection-segmentation/src/common/coco-labels.txt
  detection:
    variant: small              # nano, small, medium, or large.
    nano:
      backbone: models/rf_detr_nano/w8a8_w16a16/rf_detr_nano_w8a8_w16a16_backbone_mpk.tar.gz
      transformer: models/rf_detr_nano/w8a8_w16a16/rf_detr_nano_w8a8_w16a16_decoder_mpk.tar.gz
    small:
      backbone: models/rf_detr_small/w8a8_w16a16/rf_detr_small_w8a8_w16a16_backbone_mpk.tar.gz
      transformer: models/rf_detr_small/w8a8_w16a16/rf_detr_small_w8a8_w16a16_decoder_mpk.tar.gz
    medium:
      backbone: models/rf_detr_medium/w8a8_w16a16/rf_detr_medium_w8a8_w16a16_backbone_mpk.tar.gz
      transformer: models/rf_detr_medium/w8a8_w16a16/rf_detr_medium_w8a8_w16a16_decoder_mpk.tar.gz
    large:
      backbone: models/rf_detr_large/w8a8_w16a16/rf_detr_large_w8a8_w16a16_backbone_mpk.tar.gz
      transformer: models/rf_detr_large/w8a8_w16a16/rf_detr_large_w8a8_w16a16_decoder_mpk.tar.gz
  segmentation:
    variant: medium             # nano, small, or medium.
    nano:
      backbone: models/rf_detr_seg_nano/w8a8_w16a16/rf_detr_seg_nano_w8a8_w16a16_backbone_mpk.tar.gz
      transformer: models/rf_detr_seg_nano/w8a8_w16a16/rf_detr_seg_nano_w8a8_w16a16_decoder_mpk.tar.gz
    small:
      backbone: models/rf_detr_seg_small/w8a8_w16a16/rf_detr_seg_small_w8a8_w16a16_backbone_mpk.tar.gz
      transformer: models/rf_detr_seg_small/w8a8_w16a16/rf_detr_seg_small_w8a8_w16a16_decoder_mpk.tar.gz
    medium:
      backbone: models/rf_detr_seg_medium/w8a16_w8a8_mixed/rf_detr_seg_medium_w8a16_w8a8_mixed_backbone_mpk.tar.gz
      transformer: models/rf_detr_seg_medium/w8a16_w8a8_mixed/rf_detr_seg_medium_w8a16_w8a8_mixed_decoder_mpk.tar.gz

source:                         # H.264, H.265, or MJPEG RTSP source properties.
  rtsp_url: rtsp://<rtsp-source-ip>:<port>/<stream-name>
  codec: h264                   # h264/avc, h265/hevc, or mjpeg/jpeg.
  tcp: true                     # Use RTSP over TCP.
  latency_ms: 10                # RTSP receive latency.
  width: 0                      # Optional width fallback. 0 uses the probe.
  height: 0                     # Optional height fallback. 0 uses the probe.
  fps: 0                        # Optional FPS override. 0 uses the probe.

inference:
  frames: 0                     # 0 runs continuously.
  detection:
    min_score: 0.5              # Minimum confidence to publish.
    max_detections: 100         # Maximum objects per frame.
  segmentation:
    min_score: 0.3              # Minimum confidence to publish.
    max_segments: 24            # Maximum instances per frame.
    mask_threshold: 0.08        # Foreground threshold for the compiled model.
    mask_grid_size: 640         # Smoother contours; the model's own mask size uses less CPU.

output:
  insight:
    host: <insight-host-ip>     # Insight host reachable from the target.
    video_port: 9000            # Video ingest port.
    metadata_port: 9100         # Metadata ingest port.
