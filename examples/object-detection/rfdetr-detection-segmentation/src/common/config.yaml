# RF-DETR detection or instance segmentation of one RTSP stream, shown in Insight.
model:
  id: det-small                 # Variant in model.path: det-nano, det-small, det-medium, det-large, seg-nano, seg-small, or seg-medium.
  path: ../../../../../models/rf_detr_small/w8a8_mixed_w16a16/rf_detr_small_w8a8_mixed_w16a16_backbone_mpk.tar.gz  # Backbone package; its *_decoder_mpk.tar.gz must sit next to it. Relative paths start at this file.
  labels: support/labels/coco91.txt  # The 91 COCO class IDs, N/A for the unused IDs; relative to the working directory.

input:
  source: rtsp://<rtsp-source-ip>:<port>/<stream-name>  # RTSP URL of the stream.
  codec: h264                   # h264, h265, or mjpeg.
  width: 0                      # 0 reads the stream's frame size with a probe. Set a size
  height: 0                     # only for a stream that does not report one.
  fps: 0                        # 0 reads the stream's frame rate with a probe.
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 10              # RTSP jitter buffer.

inference:
  frames: 0                     # Results to send before stopping; 0 runs until Ctrl+C.
  min_score: 0.5                # Lowest score a result needs; use 0.5 for det-* and 0.3 for seg-*.
  max_detections: 100           # Results kept per frame; use 100 for det-* and 24 for seg-*.
  mask_threshold: 0.08          # seg-* only: mask probability at which a pixel belongs to the object.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Insight video port.
    metadata_port_base: 9100    # Insight metadata port.

app:
  mask_grid_size: 640           # seg-* only: grid the mask is resized to before its outline is traced; the model's mask size (78, 96, or 108) skips the resize and uses less CPU.
