model:
  path: <model-path>         # Example: models/<model-pack>.tar.gz
  labels: examples/object-detection/single-stream-object-detector/src/common/coco_label.txt

source:
  type: rtsp                 # rtsp, http or usb. Only the matching section below is read.

  rtsp:
    url: <rtsp-url-1>        # rtsp://<rtsp-source-ip>:<port>/<stream-name>
    codec: h264              # h264, h265 or mjpeg.
    tcp: true                # RTSP over TCP.
    latency_ms: 100          # Receive latency.
    fps: 0                   # 0 detects it from the stream. Set it for MJPEG streams that don't report one.

  http:
    url: <http-mjpeg-url>    # http(s)://... MJPEG streams only.
    ssl_strict: true         # false accepts self-signed HTTPS certificates.
    fps: 0                   # 0 detects it from the stream.

  usb:
    camera: ""               # A camera ID from pyneat.usb_camera_ids().
    width: 1280              # One of the camera's MJPEG modes, exactly: width, height and fps.
    height: 720              # Multiples of 8, at most 2040 (RTP/JPEG limit).
    fps: 30

inference:
  frames: 0                  # Frame limit. 0 means run continuously.
  min_score: 0.30            # Detection score threshold.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max detections to keep per frame.

runtime:
  profile: false             # Print aggregate profiling summaries.
  profile_interval: 100      # Rolling profile window in published frames.

output:
  save_dir: ""               # Optional directory for annotated frames. Adds a decoded-frame branch.
  save_every: 0              # Save every Nth output frame. 0 disables saving.
  insight:
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port: 9000         # UDP video port.
    metadata_port: 9100      # UDP metadata port.

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    output:
      save_every: 10
      total_saved_frames: 20
