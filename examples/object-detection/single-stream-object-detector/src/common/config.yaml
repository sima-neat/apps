# YOLO26 object detection of one RTSP, HTTP MJPEG, or USB camera stream, shown in Insight.
model:
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/yolo26m/w16a16/yolo26m_w16a16_mpk.tar.gz
  # Class labels, one per line; a relative path starts at the working directory.
  labels: examples/object-detection/single-stream-object-detector/src/common/coco_label.txt

input:
  # rtsp, http, or usb. For http, delete codec and rtsp, set source to the http:// or
  # https:// MJPEG URL, set width, height, and fps to the stream's, and add "app:" with
  # "ssl_strict: true" (false accepts a self-signed certificate). For usb, delete codec and
  # rtsp, set source to a camera ID from pyneat.usb_camera_ids(), and set width, height, and
  # fps to one of its modes.
  type: rtsp
  source: rtsp://<rtsp-source-ip>:<port>/<stream-name>  # The RTSP URL.
  codec: h264                   # h264, h265, or mjpeg.
  width: 0                      # 0 reads the RTSP stream's frame size and rate with a probe.
  height: 0                     # Set them only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Frames to process before stopping; 0 runs until stopped.
  min_score: 0.30               # Lowest score a detection needs.
  nms_iou: 0.60                 # Overlap at which NMS drops the weaker box.
  max_detections: 50            # Boxes kept per frame.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Insight video port.
    metadata_port_base: 9100    # Insight metadata port.
