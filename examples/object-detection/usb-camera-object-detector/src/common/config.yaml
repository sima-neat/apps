model:                       # Detection model selection.
  path: <model-path>         # Example: models/<model-pack>.tar.gz
  labels: examples/object-detection/usb-camera-object-detector/src/common/coco_label.txt

source:                      # USB (UVC) camera capture.
  device: <video-capture-node>   # Required: find your USB camera with v4l2-ctl --list-devices.
  width: 1920                # Example default; choose a width listed under MJPG.
  height: 1080               # Choose the matching height for that MJPG mode.
  fps: 30                    # Choose an FPS listed for that MJPG resolution.
  flip: none                 # none, rotate-180, horizontal-flip, or vertical-flip.
  override_fragment: ""      # Diagnostic: replace the camera with any NV12 GStreamer fragment.

inference:                   # Detection settings.
  frames: 0                  # Frame limit. 0 means run until interrupted.
  min_score: 0.30            # Detection score threshold.
  nms_iou: 0.50              # NMS IoU threshold.
  max_detections: 100        # Max detections to keep per frame.

runtime:                     # Runtime settings.
  profile: false             # Print windowed profiling lines and the generated backend.
  profile_interval: 100      # Rolling profile window in published frames.
  queue_depth: 3             # Pipeline queue depth. 3 keeps latency low.

output:                      # Insight receiver.
  insight:
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port: 9000         # Destination UDP video port for channel 0 (1..65535).
    metadata_port: 9100      # Destination UDP metadata port for channel 0 (1..65535).
    bitrate_kbps: 4000       # H.264 encoder bitrate.

# Test harness settings only. Normal example runs ignore this section.
# The e2e tests have no camera, so they drive the same graph from a fixed COCO image repeated as an
# NV12 source through source.override_fragment.
testing:
  e2e:
    source:
      override_fragment: "filesrc location=assets/datasets-test/coco/000000265108.jpg ! jpegdec ! imagefreeze is-live=true ! videoscale ! videoconvert ! video/x-raw,format=NV12,width=1920,height=1080,framerate=30/1 ! queue leaky=downstream max-size-buffers=2"
    inference:
      frames: 30
