# YOLO26 object detection of a folder of images, saved as annotated PNGs.
model:
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/yolo26m/w16a16/yolo26m_w16a16_mpk.tar.gz
  # The 80 COCO classes YOLO26 scores, one label per line in class ID order; a relative path
  # starts at the working directory.
  labels: examples/object-detection/yolo26-object-detector/src/common/coco_label.txt

input:
  source: assets/datasets/coco  # Folder of .jpg, .jpeg, .png, and .bmp images.

inference:
  min_score: 0.40               # Lowest score a detection needs.
  nms_iou: 0.60                 # Overlap above which the weaker of two same-class boxes is dropped.
  max_detections: 50            # Boxes kept per image.

output:
  dir: sandbox/yolo26-object-detector  # Folder for the annotated PNGs.
