# SSD-MobileNet object detection of a folder of images, saved as annotated PNGs and JSON.
model:
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/ssd_mobilenet_v2_modalix_int8_tess_mla_mpk.tar.gz
  # Class labels, one per line, background first; a relative path starts at the working
  # directory.
  labels: examples/object-detection/ssd-mobilenet-object-detector/src/common/coco_labels.txt

input:
  source: assets/datasets/coco  # Folder of .jpg, .jpeg, .png, and .bmp images.

inference:
  min_score: 0.55               # Lowest score a detection needs.
  nms_iou: 0.60                 # Overlap at which NMS drops the weaker box.
  max_detections: 100           # Boxes kept per image.

output:
  dir: sandbox/ssd-mobilenet-object-detector  # Folder for the annotated PNGs.

app:
  # Normalization the model was trained with: tensorflow_ssd for SSD-MobileNet V1 and V2, or
  # torchvision_ssdlite for SSDlite-MobileNetV3.
  preprocessing_profile: tensorflow_ssd
  # JSON report of every image's boxes; "" writes no report.
  detections_json: sandbox/ssd-mobilenet-object-detector.json
