model:                       # SSD detector selection (SSD300 or SSD-MobileNet v1/v2/v3).
  path: <model-path>         # Example: models/ssd_mobilenet_v2_heads_mpk.tar.gz
  frame: 300                 # Model input frame: 300 for SSD300/v1/v2, 320 for v3.
  labels: examples/object-detection/ssd-mobilenet-object-detector/src/common/coco_labels.txt      # 91 lines: 0=background, 1..90 COCO.

io:                          # Input and output paths.
  input_dir: assets/datasets/coco                     # Folder containing input images.
  output_dir: sandbox/ssd-mobilenet-object-detector   # Folder for annotated images.
  detections_json: ""        # Optional path for a machine-readable detections report.

decode:                      # Model-managed SSD BoxDecode settings.
  score_threshold: 0.55      # Filters weak SSD-MobileNet false positives in rendered output.
  nms_iou: 0.60              # Overlap threshold for on-device NMS.
  max_detections: 100        # Top-K detections to keep per image.

postprocess:                 # Optional app policy applied after faithful model-managed decode.
  aggregate_suppression: true       # Hide large COCO crowd regions containing object instances.
  min_parent_area_fraction: 0.20    # Candidate aggregate must cover at least this frame fraction.
  min_child_containment: 0.90       # Fraction of each smaller box enclosed by the aggregate.
  max_child_area_ratio: 0.25        # Each child must be at most this fraction of the parent area.
  min_children: 2                   # Same-class children required to suppress an aggregate.

runtime:                     # Runtime settings.
  timeout_ms: 20000          # Inference timeout in milliseconds.
  num_runs: 1                # Number of repeated runs (profiling).
  profile: false             # Print profiling summaries.
  verbose: false             # Python only: verbose runtime logging (ignored by the C++ app).

output:                      # Output rendering settings.
  overlay: true              # Draw boxes and labels on output images.
