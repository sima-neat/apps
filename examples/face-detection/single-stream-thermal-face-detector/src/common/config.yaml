# yolov5s-face detection of faces and five landmarks in one thermal RTSP stream, shown in Insight.
model:
  # Compiled model package; a relative path starts at this file.
  path: ../../../../../models/yolov5s_face_raw_split_mpk.tar.gz
  # Class labels, one per line; a relative path starts at the working directory.
  labels: examples/face-detection/single-stream-thermal-face-detector/src/common/face_label.txt

input:
  source: rtsp://<rtsp-source-ip>:<port>/<stream-name>  # The H.264 RTSP URL.
  width: 0                      # 0 reads the stream's frame size and rate with a probe.
  height: 0                     # Set them only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Frames to process before stopping; 0 runs until stopped.
  min_score: 0.25               # Lowest face score (object score x class score).
  nms_iou: 0.45                 # Overlap at which NMS drops the weaker face.
  max_detections: 50            # Faces kept per frame.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Insight video port.
    metadata_port_base: 9100    # Insight metadata port.
