model:
  path: models/yolov5s_face_raw_split_mpk.tar.gz   # Compiled model archive.
  labels: examples/face-detection/single-stream-thermal-face-detector/src/common/face_label.txt

source:
  rtsp_url: <rtsp-url>       # Example: rtsp://<insight-host-ip>:<rtsp-port>/src0
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.

inference:
  frames: 0                  # Frame limit. 0 means run continuously.
  min_score: 0.25            # Face confidence threshold (obj * cls).
  nms_iou: 0.45              # NMS IoU threshold.
  max_detections: 50         # Max faces to keep per frame.

runtime:
  profile: false             # Print aggregate profiling summaries.
  profile_interval: 100      # Rolling profile window in published frames.

output:
  insight:
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port: 9000         # UDP video base port (add channel).
    metadata_port: 9100      # UDP metadata base port (add channel).
