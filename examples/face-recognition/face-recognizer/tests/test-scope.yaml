models:
  scrfd:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/scrfd_2.5g_bnkps.mla_mpk.tar.gz
    file: scrfd_2.5g_bnkps.mla_mpk.tar.gz
  arcface:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/w600k_r50.surgery_mpk.tar.gz
    file: w600k_r50.surgery_mpk.tar.gz

unit:
  python: false
  cpp: true

e2e:
  python:
    enabled: false
    reason: >
      Python is omitted because the application relies on three C++-only SDK
      paths that have no Python equivalents in this SDK version: the SiMa HW
      H.264 encoder (VideoSender / H264RtpUdpFromRaw), the EV74 CVU preproc
      node (InputKind::Image / RtspDecodedInput NV12 zero-copy chain), and
      the NV12 buffer manipulation required for low-latency overlay.
      A Python implementation will be added when the SDK exposes bindings for
      these capabilities.
  cpp:
    enabled: true
    models:
      - scrfd
      - arcface
