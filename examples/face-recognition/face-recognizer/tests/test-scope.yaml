models:
  scrfd:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/scrfd_2.5g_bnkps.mla_mpk.tar.gz
    file: scrfd_2.5g_bnkps.mla_mpk.tar.gz
  arcface:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/w600k_r50.surgery_mpk.tar.gz
    file: w600k_r50.surgery_mpk.tar.gz

unit:
  # Python shares no standalone helper module with tests; its decode/match/align
  # logic is exercised end to end by tests/python/test_e2e.py.
  python: false
  cpp: true

e2e:
  python:
    enabled: true
    models:
      - scrfd
      - arcface
    assets:
      bundled:
        - path: tests/assets/face_clip.mp4
          description: >
            3 s H.264 clip (1280x720, 30 FPS) made from paresh_0012.jpg. Every frame
            must contain a face recognized as Paresh.
        - path: tests/assets/gallery.bin
          description: >
            Gallery with the Paresh identity, enrolled from paresh_0012.jpg with:
              face-recognizer --enroll --config src/common/config.yaml
                              --images tests/assets/gallery_images/
                              --gallery tests/assets/gallery.bin
    notes:
      - >
        The RTSP test checks that the live-stream graph processes 60 frames and exits 0;
        the shared CI stream content is not controlled, so detections are asserted on
        the bundled clip instead.
  cpp:
    enabled: true
    models:
      - scrfd
      - arcface
    assets:
      bundled:
        - path: tests/assets/face_clip.mp4
          description: >
            Every frame must contain a face recognized as Paresh; also used for the
            --output recording and --enroll --video checks.
        - path: tests/assets/gallery.bin
          description: Gallery with the Paresh identity (see the python entry).
        - path: tests/assets/gallery_images/Paresh/paresh_0012.jpg
          description: Enrollment source for the --enroll --images check.
    notes:
      - >
        The RTSP run checks that the live-stream graph processes 60 frames and exits 0;
        detections are asserted on the bundled clip.
