camera:
  # Leave empty to select libcamera's default camera. Use `cam -l` to list names.
  name: ""
  # Requested frame width in pixels; the camera and ISP must support it.
  width: 1920
  # Requested frame height in pixels; the camera and ISP must support it.
  height: 1080
  # Numerator of the requested camera frame rate.
  fps_num: 30
  # Denominator of the requested camera frame rate.
  fps_den: 1
  # Camera pixel format. This example supports NV12 only.
  format: NV12
  # Minimum camera capture buffers. Keep 0 (camera default): Platform 3.0's
  # libcamerasrc has no buffer-count property and Core rejects any other value.
  capture_buffers: 0
  # Fail instead of copying when strict DMA-BUF negotiation is unavailable.
  strict_zero_copy: true
  # Depth used for the camera's live queue and the terminal output queue.
  queue_depth: 2

capture:
  # Total wall-clock capture duration in seconds.
  duration_seconds: 30
  # Elapsed times, in seconds, at which to retain NV12 snapshots.
  sample_times_seconds: [3, 15, 27]
  # Maximum wait for each frame; the deadline may shorten this timeout.
  pull_timeout_ms: 2000

output:
  # Directory for sampled NV12 frames and summary.json.
  directory: sandbox/mipi-camera-capture

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional outputs; inference/results are unchanged when both are disabled.
  visualization:
    max_streams: 4       # Bound the number of distinct input header.frame_id values.
    save:
      enabled: false
      directory: sandbox/ros2/benchmarking/mipi-camera-capture/visuals  # Each run creates a new subfolder.
      every_n_frames: 1       # Save every N completed frames per camera.
    insight:
      enabled: false         # Launch reads this automatically; no extra sink command.
      host: ""               # Reachable Insight host/IP; required when enabled.
      video_port_base: 9000   # Use the UDP base exposed by your Insight service.
      channel_base: 0
      max_visible_streams: 4  # Limit hardware encoders; inference still handles all inputs.
      fps: 30                # Maximum visualization sends/second per camera.
      bitrate_kbps: 4000
      channels: {}           # Optional {input_frame_id: Insight_channel}; selects visible streams.
  input_policy: complete       # complete preserves admitted frames; latest favors freshness.
  pending_frames: 8
  inflight_frames: 4
  source_window: 4            # Outstanding images per source in complete mode.
