model:                       # Model package selection.
  path: <model-path>         # Example: models/<model-pack>.tar.gz

benchmark:                   # Synthetic benchmark settings.
  frames: 100                # Minimum synthetic frames per pass.
  min_duration_ms: 30000     # Minimum length of each pass, in milliseconds.

output:                      # Benchmark report output.
  report_json: sandbox/model-benchmark/report.json # JSON report path.

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional native BoxDecode benchmark route: yolo26-det or yolo26-seg.
  decode_type: null
