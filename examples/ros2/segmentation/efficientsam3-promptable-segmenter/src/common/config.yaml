model:
  path: <model-path>         # Compiled model archive, e.g. models/efficientsam3_mpk.tar.gz.
  text_encoder: <text-encoder-path>  # Text encoder package, e.g. models/efficientsam3_text_encoder_mpk.tar.gz. Runs once at startup.

prompt:
  text: "person"             # What to segment: any short noun phrase, e.g. "red car", "dog", "traffic sign".
                             # At most 14 tokens (about 10 words); a longer prompt is rejected at startup.

source:
  rtsp_url: <rtsp-url>       # RTSP stream, e.g. rtsp://<insight-host-ip>:8554/src1.
  codec: h264                # Stream codec: h264 or h265.
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.

inference:
  frames: 0                  # Segmented-frame limit. 0 means run continuously.
  min_score: 0.30            # Instance score (query probability x presence) that counts as a match. EfficientSAM3
                             # scores found objects about 0.3-0.8; presence keeps absent prompts below 0.1.
  max_detections: 20         # Max instances per frame.
  mask_threshold: 0.50       # Mask probability inside the outline.

runtime:
  profile: false             # Print aggregate profiling summaries.
  profile_interval: 100      # Rolling profile window in segmented frames.

output:
  save_dir: ""               # Optional directory for annotated frames.
  save_every: 0              # Save every Nth segmented frame. 0 disables saving.
  insight:
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port: 9000         # UDP video port.
    metadata_port: 9100      # UDP metadata port.

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional outputs; inference/results are unchanged when both are disabled.
  visualization:
    max_streams: 4       # Bound the number of distinct input header.frame_id values.
    save:
      enabled: false
      directory: sandbox/ros2/segmentation/efficientsam3-promptable-segmenter/visuals  # Each run creates a new subfolder.
      every_n_frames: 1       # Save every N completed frames per camera.
    insight:
      enabled: false         # Launch reads this automatically; no extra sink command.
      host: ""               # Reachable Insight host/IP; required when enabled.
      video_port_base: 9000   # Use the UDP base exposed by your Insight service.
      channel_base: 0
      max_visible_streams: 4  # Limit hardware encoders; inference still handles all inputs.
      fps: 30                # Maximum visualization sends/second per camera.
      bitrate_kbps: 4000
      channels: {}           # Optional {input_frame_id: Insight_channel}; selects visible streams.
  input_policy: complete       # complete preserves admitted frames; latest favors freshness.
  pending_frames: 8
  inflight_frames: 4
  source_window: 4            # Outstanding images per source in complete mode.
  source_timeout_seconds: 180
  result_timeout_seconds: 180
