# Image classification explorer configuration.
#
# `models` lists one or more model profiles. Every profile is self-contained:
# artifact path, input size, preprocessing preset, output interpretation, label
# mapping, and top-k. Nothing is inferred from the model file name. Add a
# profile to compare an additional model against the ones already listed.

io:                           # Input image settings.
  input: null                 # Single image, or a directory read one level deep (subdirectories ignored).
                              # null uses the fallback sample image.
  fallback_image_url: https://raw.githubusercontent.com/EliSchwartz/imagenet-sample-images/master/n01443537_goldfish.JPEG
  extensions: .jpg,.jpeg,.png,.bmp    # Recognized image extensions, comma separated.
  output_dir: sandbox/report  # Dedicated directory for report.html/json/csv and thumbnails; replaced on each run.
  output_format: [html]       # Which reports to write: any of html, json, csv. Thumbnails follow html.

models:
  resnet_50:
    path: models/resnet_50_mpk.tar.gz
    input_width: 224
    input_height: 224
    preprocess: imagenet      # Maps to pyneat/simaai NormalizePreset::ImageNet.
    output: softmax           # Output interpretation: raw per-class scores; softmax is
                               # applied and index i maps to label_map[i]. Only value implemented.
    num_classes: 1000
    label_map: src/common/imagenet_labels.txt   # One label per line; line index is the class id.
    top_k: 5

  resnet_18:
    path: models/resnet_18_mpk.tar.gz
    input_width: 224
    input_height: 224
    preprocess: imagenet
    output: softmax
    num_classes: 1000
    label_map: src/common/imagenet_labels.txt
    top_k: 5

  efficientnet_b0:
    path: models/efficientnet_b0_mpk.tar.gz
    input_width: 224
    input_height: 224
    preprocess: imagenet
    output: softmax
    num_classes: 1000
    label_map: src/common/imagenet_labels.txt
    top_k: 5

  densenet_121:
    path: models/densenet_121_mpk.tar.gz
    input_width: 224
    input_height: 224
    preprocess: imagenet
    output: softmax
    num_classes: 1000
    label_map: src/common/imagenet_labels.txt
    top_k: 5

validation:                   # Used by the bundled sample-image regression test, not normal runs.
  expected_class_id: 1        # ImageNet class id for goldfish.
  min_probability: 0.20

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional outputs; inference/results are unchanged when both are disabled.
  visualization:
    max_streams: 4       # Bound the number of distinct input header.frame_id values.
    save:
      enabled: false
      directory: sandbox/ros2/classification/image-classification-explorer/visuals  # Each run creates a new subfolder.
      every_n_frames: 1       # Save every N completed frames per camera.
    insight:
      enabled: false         # Launch reads this automatically; no extra sink command.
      host: ""               # Reachable Insight host/IP; required when enabled.
      video_port_base: 9000   # Use the UDP base exposed by your Insight service.
      channel_base: 0
      max_visible_streams: 4  # Limit hardware encoders; inference still handles all inputs.
      fps: 30                # Maximum visualization sends/second per camera.
      bitrate_kbps: 4000
      channels: {}           # Optional {input_frame_id: Insight_channel}; selects visible streams.
  input_policy: complete       # complete preserves admitted frames; latest favors freshness.
  pending_frames: 8
  inflight_frames: 4
  source_window: 4            # Outstanding images per source in complete mode.
