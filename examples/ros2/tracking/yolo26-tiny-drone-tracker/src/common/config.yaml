model:
  path: models/yolo26n_p2_tiny_drone_int8_qat_b1_mpk.tar.gz

streams:
  - <tiny-drone-rtsp-url>

input:
  codec: h264
  tcp: true
  latency_ms: 100

runtime:
  profile: true
  warmup_frames: 30

inference:
  frames: 0
  fps: 0                       # Output/inference FPS; 0 keeps the source rate.
  max_inflight_per_stream: 4
  max_inflight_total: 4
  num_classes: 1
  target_class_id: 0
  target_label: drone
  min_score: 0.05
  nms_iou: 0.60
  max_detections: 100

tracking:
  high_score_threshold: 0.20
  new_track_threshold: 0.30
  match_iou_threshold: 0.05
  center_distance_enabled: true
  max_center_distance: 3.0
  velocity_momentum: 0.75
  max_missing_frames: 30
  min_confirmed_hits: 2
  max_active_tracks: 256

output:
  insight:
    host: <insight-host-ip>
    video_port_base: 9000
    metadata_port_base: 9100
  video_enabled: true
  debug_dir: null
  save_every: 0

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    output:
      save_every: 10
      total_saved_frames: 20

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional outputs; inference/results are unchanged when both are disabled.
  visualization:
    max_streams: 4       # Bound the number of distinct input header.frame_id values.
    save:
      enabled: false
      directory: sandbox/ros2/tracking/yolo26-tiny-drone-tracker/visuals  # Each run creates a new subfolder.
      every_n_frames: 1       # Save every N completed frames per camera.
    insight:
      enabled: false         # Launch reads this automatically; no extra sink command.
      host: ""               # Reachable Insight host/IP; required when enabled.
      video_port_base: 9000   # Use the UDP base exposed by your Insight service.
      channel_base: 0
      max_visible_streams: 4  # Limit hardware encoders; inference still handles all inputs.
      fps: 30                # Maximum visualization sends/second per camera.
      bitrate_kbps: 4000
      channels: {}           # Optional {input_frame_id: Insight_channel}; selects visible streams.
  input_policy: complete       # complete preserves admitted frames; latest favors freshness.
  pending_frames: 8
  inflight_frames: 4
  source_window: 4            # Outstanding images per source in complete mode.
