models:                              # Model packages are supplied at runtime.
  detector_path: <detector-model-path> # Default: yolo26m-det-int8-b1.tar.gz.
  pose_path: <blazepose-model-path>  # Default: blazepose_ghum_heavy_w16a16_mpk.tar.gz.

streams:                             # Configure one to four cameras; restart after edits.
  - id: camera0                     # Unique stable stream identity.
    url: <rtsp-url>                 # RTSP source URL.
    codec: h264                     # h264 or h265.
    insight_channel: 0              # Unique Insight video/metadata channel.
    width: 1920                     # Required source dimensions and decoder FPS hint.
    height: 1080
    fps: 30

input:
  tcp: true                         # Use TCP for RTSP transport.
  latency_ms: 100                   # RTSP receive latency in milliseconds.

detector:
  min_score: 0.30                   # YOLO score threshold.
  nms_iou: 0.60                     # YOLO NMS IoU threshold.

pose:
  max_people_per_frame: 1           # Highest-confidence people sent to BlazePose; maximum 10.
  roi_scale: 1.65                   # Square ROI expansion around each person box.
  presence_threshold: 0.50          # Global BlazePose presence threshold.
  temporal_filter_enabled: true     # Per-stream exponential smoothing of matched 2D/3D landmarks.

runtime:
  frames: 0                         # Source frames per stream; 0 runs until interrupted.

output:
  insight:
    host: <insight-host-ip>         # Host running Insight.
    video_port_base: 9000           # Insight videoUDP base port.
    metadata_port_base: 9100        # Insight metadataUDP base port.

# Test harness settings only. Normal runs ignore this section.
testing:
  e2e:
    runtime:
      frames: 12

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional outputs; inference/results are unchanged when both are disabled.
  visualization:
    max_streams: 4       # Bound the number of distinct input header.frame_id values.
    frame_cache: 8           # Retained images per camera; unmatched visuals are counted/skipped.
    save:
      enabled: false
      directory: sandbox/ros2/pose-estimation/multi-stream-blazepose3d/visuals  # Each run creates a new subfolder.
      every_n_frames: 1       # Save every N completed frames per camera.
    insight:
      enabled: false         # Launch reads this automatically; no extra sink command.
      host: ""               # Reachable Insight host/IP; required when enabled.
      video_port_base: 9000   # Use the UDP base exposed by your Insight service.
      metadata_port_base: 9100 # Native 3D Pose auxiliary panel uses this UDP base + channel.
      auxiliary: true        # Send native world landmarks to Insight's blazepose-3d renderer.
      channel_base: 0
      max_visible_streams: 4  # Limit hardware encoders; inference still handles all inputs.
      fps: 30                # Maximum visualization sends/second per camera.
      bitrate_kbps: 4000
      channels: {}           # Optional {input_frame_id: Insight_channel}; selects visible streams.
  input_policy: latest        # Match native replacement of stale queued work.
  source_timeout_seconds: 30  # Fail if a configured camera stops publishing.
  result_timeout_seconds: 30  # Maximum wait for result subscribers or shutdown drain.
