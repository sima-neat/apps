model:                       # PCB defect detector model selection.
  path: <model-path>         # Example: models/<model-pack>.tar.gz
  labels: src/common/pcb_label.txt
  input_max_width: 3840      # Largest input width one graph accepts (ingress capacity).
  input_max_height: 2160     # Largest input height one graph accepts.

io:                          # Input and output paths.
  input_dir: <image-directory>                # Folder containing input PCB images.
  output_dir: sandbox/pcb-defect-detector       # Folder for annotated images.

decode:                      # YOLO26 on-device box decode settings.
  score_threshold: 0.25      # Minimum defect confidence.
  nms_iou: 0.45              # Overlap threshold for NMS.
  max_detections: 300        # Max detections to keep per image.

runtime:                     # Runtime settings.
  num_runs: 1                # Number of repeated runs.
  queue_depth: 8             # Runtime queue depth.
  profile: false             # Print per-image profiling summaries.

output:                      # Output rendering settings.
  overlay: true              # Draw boxes and labels on output images.

# ROS image-topic settings. See this example's README.md.
ros:
  # Optional outputs; inference/results are unchanged when both are disabled.
  visualization:
    max_streams: 4       # Bound the number of distinct input header.frame_id values.
    save:
      enabled: false
      directory: sandbox/ros2/object-detection/pcb-defect-detector/visuals  # Each run creates a new subfolder.
      every_n_frames: 1       # Save every N completed frames per camera.
    insight:
      enabled: false         # Launch reads this automatically; no extra sink command.
      host: ""               # Reachable Insight host/IP; required when enabled.
      video_port_base: 9000   # Use the UDP base exposed by your Insight service.
      channel_base: 0
      max_visible_streams: 4  # Limit hardware encoders; inference still handles all inputs.
      fps: 30                # Maximum visualization sends/second per camera.
      bitrate_kbps: 4000
      channels: {}           # Optional {input_frame_id: Insight_channel}; selects visible streams.
  input_policy: complete       # complete preserves admitted frames; latest favors freshness.
  pending_frames: 8
  inflight_frames: 4
  source_window: 4            # Outstanding images per source in complete mode.
