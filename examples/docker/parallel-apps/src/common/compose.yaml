# Runs four installed Apps examples side by side, one per container.
# Relative paths start from this file's directory: ../../../.. is
# prebuilt-apps/examples/ and ../../../../.. is prebuilt-apps/.
name: neat-parallel-apps

x-build: &build
  context: ../../../../..
  dockerfile: examples/docker/parallel-apps/src/common/Dockerfile

x-neat-app: &neat-app
  # The apps use the board's own network, so RTSP sources and Insight need no
  # port mapping. Older board kernels also lack NAT for Docker's bridge network.
  network_mode: host
  # The board's sima user. The accelerator device nodes belong to its group.
  user: "1000:1000"
  # The apps shut down cleanly on SIGINT. As PID 1 they ignore the default SIGTERM.
  stop_signal: SIGINT
  # Neat unpacks model packages here.
  tmpfs: /tmp:mode=1777
  devices:
    - /dev/mla                    # machine learning accelerator
    - /dev/cvu                    # computer vision unit (pre- and post-processing)
    - /dev/simaai-mem             # shared accelerator memory
    - /dev/dma_heap/linux,cma
    - /dev/dma_heap/simaai,dms
    - /dev/allegroDecodeIP        # video decoder
    - /dev/allegroIP              # video encoder
  volumes:
    # The board's installed Neat, system libraries, and tools, shared read-only.
    # /bin and /lib are the board's links into /usr.
    - /usr:/usr:ro
    - /bin:/bin:ro
    - /lib:/lib:ro
    - /etc/ld.so.cache:/etc/ld.so.cache:ro
    - /etc/alternatives:/etc/alternatives:ro
    - ../../../../../models:/apps/models:ro

services:
  segmentation:
    <<: *neat-app
    build:
      <<: *build
      args:
        EXAMPLE: segmentation/single-stream-instance-segmenter
        BINARY: single-stream-instance-segmenter
    configs:
      - source: segmentation
        target: /apps/config.yaml

  detection:
    <<: *neat-app
    build:
      <<: *build
      args:
        EXAMPLE: object-detection/rfdetr-detection-segmentation
        BINARY: rfdetr-detection-segmentation
    configs:
      - source: detection
        target: /apps/config.yaml

  tracking:
    <<: *neat-app
    build:
      <<: *build
      args:
        EXAMPLE: tracking/multi-stream-tracker
        BINARY: multi-stream-tracker
    configs:
      - source: tracking
        target: /apps/config.yaml

  pose:
    <<: *neat-app
    build:
      <<: *build
      args:
        EXAMPLE: pose-estimation/multi-stream-pose-estimator
        BINARY: multi-stream-pose-estimator
    configs:
      - source: pose
        target: /apps/config.yaml

# Each container reads its example's own config.yaml, mounted read-only.
configs:
  segmentation:
    file: ../../../../segmentation/single-stream-instance-segmenter/src/common/config.yaml
  detection:
    file: ../../../../object-detection/rfdetr-detection-segmentation/src/common/config.yaml
  tracking:
    file: ../../../../tracking/multi-stream-tracker/src/common/config.yaml
  pose:
    file: ../../../../pose-estimation/multi-stream-pose-estimator/src/common/config.yaml
