model:                       # Settings shared by every stream.
  labels: examples/multi-model/multi-stream-multi-model/src/common/coco_label.txt

streams:                     # One entry per camera. Each entry runs its own model.
  - url: <rtsp-url-1>        # Example: rtsp://<rtsp-source-ip>:<port>/<stream-name>
    task: detection          # detection, segmentation, or pose.
    decode: yolov8           # Head layout of this package: yolov8 or yolo26.
    model: <model-path>      # Example: models/yolo_11s_mpk.tar.gz
  - url: <rtsp-url-2>
    task: segmentation
    decode: yolov8
    model: <model-path>      # Example: models/yolo_11s_seg_mpk.tar.gz
  - url: <rtsp-url-3>
    task: pose
    decode: yolo26
    model: <model-path>      # Example: models/yolo26m-pose-int8-b1.tar.gz
  - url: <rtsp-url-4>
    task: detection
    decode: yolo26
    model: <model-path>      # Example: models/yolo26m-det-int8-b1.tar.gz

input:                       # RTSP input transport settings.
  codec: h264                # h264/avc or h265/hevc.
  tcp: true                  # Use TCP for RTSP transport.
  latency_ms: 100            # RTSP receive latency in milliseconds.

runtime:                     # Runtime and profiling settings.
  profile: true              # Print per-stream timing summaries.
  warmup_frames: 30          # Drain this many frames before metadata/profile output.

inference:                   # Controls shared by every model.
  frames: 0                  # Frame limit per stream. 0 means unlimited.
  fps: 0                     # Max per-stream processing and output FPS. 0 means use source FPS.
  max_inflight_per_stream: 4 # Frames this stream may have inside its model at once.
  min_score: 0.30            # Detection, segmentation, and pose score threshold.
  nms_iou: 0.60              # NMS IoU threshold.
  max_detections: 50         # Max instances to keep per frame after NMS.

output:                      # Insight output plus optional local debug saves.
  insight:                   # Live video and metadata destination.
    host: <insight-host-ip>  # Host running the Insight receiver/viewer.
    video_port_base: 9000    # Base UDP port for video channels.
    metadata_port_base: 9100 # Base UDP port for metadata channels.
  video_enabled: true        # Disable to publish metadata only.
  mask_threshold: 0.50       # Mask threshold for segmentation polygons and saved frames.
  mask_alpha: 0.55           # Mask overlay opacity in saved frames.
  min_keypoint_visibility: 0.30 # Hide lower-confidence joints on saved debug overlays.
  debug_dir: null            # Optional directory for periodic debug frame saves.
  save_every: 0              # Save every Nth debug frame. 0 disables saving.

# Test harness settings only. Normal example runs ignore this section.
testing:
  e2e:
    output:
      save_every: 10
      total_saved_frames: 20
