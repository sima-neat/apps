# A different YOLO model on each of up to four RTSP streams, shown in Insight.
model:
  # Class labels of the detection and segmentation models, one per line. A relative path starts
  # at the working directory.
  labels: examples/multi-model/multi-stream-multi-model/src/common/coco_label.txt

input:
  source:                       # One to four RTSP URLs, the most the example is tested with. The
                                # same URL may repeat. Stream i runs model i of app.model_paths
                                # and goes to Insight channel i.
    - <rtsp-url-1>
    - <rtsp-url-2>
    - <rtsp-url-3>
    - <rtsp-url-4>
  codec: h264                   # h264 or h265, for every stream.
  width: 0                      # 0 reads each stream's frame size and rate with a probe. Set
  height: 0                     # them only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Results each stream sends before the app stops. 0 runs until
                                # stopped.
  min_score: 0.30               # Lowest score a detection, segment, or pose needs.
  nms_iou: 0.60                 # Overlap at which NMS drops the weaker result.
  max_detections: 50            # Objects, segments, or poses kept per frame.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Stream i sends video to this port + i.
    metadata_port_base: 9100    # Stream i sends results to this port + i.

app:
  model_paths:                  # Compiled model package of each stream, in input.source order.
                                # A relative path starts at this file.
    - ../../../../../models/yolo11s/w8a8/yolo11s_w8a8_mpk.tar.gz
    - ../../../../../models/yolo26s_seg/w8a16/yolo26s_seg_w8a16_mpk.tar.gz
    - ../../../../../models/yolo26m_pose/w8a8/yolo26m_pose_w8a8_mpk.tar.gz
    - ../../../../../models/yolo26m/w8a8/yolo26m_w8a8_mpk.tar.gz
  model_ids:                    # What each package runs, in the same order: yolov8, yolov8-seg,
                                # yolov8-pose, yolo26, yolo26-seg, or yolo26-pose. YOLO11
                                # packages carry the YOLOv8 heads.
    - yolov8
    - yolo26-seg
    - yolo26-pose
    - yolo26
