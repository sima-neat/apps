# A different YOLO model on each of up to four RTSP streams, shown in Insight.
model:                          # One entry per stream, in input.source order.
  # id: what the package runs: yolov8, yolov8-seg, yolov8-pose, yolo26, yolo26-seg, or
  #   yolo26-pose. YOLO11 packages carry the YOLOv8 heads.
  # path: the compiled model package. A relative path starts at this file.
  # labels: class labels, one per line, for a detection or segmentation model. A relative path
  #   starts at the working directory. A pose model needs none.
  - id: yolov8
    path: ../../../../../models/yolo11s/w8a8/yolo11s_w8a8_mpk.tar.gz
    labels: support/labels/coco80.txt
  - id: yolo26-seg
    path: ../../../../../models/yolo26s_seg/w8a16/yolo26s_seg_w8a16_mpk.tar.gz
    labels: support/labels/coco80.txt
  - id: yolo26-pose
    path: ../../../../../models/yolo26m_pose/w8a8/yolo26m_pose_w8a8_mpk.tar.gz
  - id: yolo26
    path: ../../../../../models/yolo26m/w8a8/yolo26m_w8a8_mpk.tar.gz
    labels: support/labels/coco80.txt

input:
  source:                       # One to four RTSP URLs, the tested maximum. A URL may repeat.
                                # Stream i runs model entry i and goes to Insight channel i.
    - <rtsp-url-1>
    - <rtsp-url-2>
    - <rtsp-url-3>
    - <rtsp-url-4>
  codec: h264                   # h264 or h265, for every stream.
  width: 0                      # 0 reads each stream's frame size and rate with a probe. Set
  height: 0                     # them only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Results each stream sends before the app stops. 0 or less
                                # runs until stopped.
  min_score: 0.30               # Lowest score a detection, segment, or pose needs.
  nms_iou: 0.60                 # Overlap at which NMS drops the weaker result, for YOLO26 too.
  max_detections: 50            # Objects, segments, or poses kept per frame.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Stream i sends video to this port + i.
    metadata_port_base: 9100    # Stream i sends results to this port + i.
