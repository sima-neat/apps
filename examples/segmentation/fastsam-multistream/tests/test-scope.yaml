models:
  fastsam_x:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/FastSAM-x_quant_mpk.tar.gz
    file: FastSAM-x_quant_mpk.tar.gz
  mobileclip2_s0_image_encoder:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/MobileCLIP2-S0_image_encoder_reparam_mpk.tar.gz
