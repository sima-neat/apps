model:
  path: <model-path>  # Example: assets/models/<model-pack>.tar.gz

io:
  input_dir: assets/test_images
  output_dir: sandbox/yolov8-instance-segmenter

runtime:
  infer_size: 640
  timeout_ms: 20000
  queue_depth: 8

decode:
  score_threshold: 0.60
  nms_iou: 0.45
  max_detections: 200

visualization:
  mask_alpha: 0.65
