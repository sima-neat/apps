models:
  yolo26m_seg_w16a16_mpk:
    source: model-registry
    name: yolo26m_seg
    ref: main
    spec: latest
    variant: w16a16
    file: yolo26m_seg_w16a16_mpk.tar.gz
  yolo26n_seg_w16a16_mpk:
    source: model-registry
    name: yolo26n_seg
    ref: main
    spec: latest
    variant: w16a16
    file: yolo26n_seg_w16a16_mpk.tar.gz
  yolo26m_seg_w8a8_mpk:
    source: model-registry
    name: yolo26m_seg
    ref: main
    spec: latest
    variant: w8a8
    file: yolo26m_seg_w8a8_mpk.tar.gz
  yolo_v8n_seg:
    source: url
    url: https://docs.sima.ai/pkg_downloads/SDK{modelzoo_version}/models/modalix/yolo_v8n_seg_mpk.tar.gz
    file: yolo_v8n_seg_mpk.tar.gz
unit:
  python: false
  cpp: false
e2e:
  # The first model is the harness default; both families are downloaded and exercised.
  python:
    enabled: false
    requires_rtsp: true
    models:
    - yolo26m_seg_w16a16_mpk
    - yolo_v8n_seg
    variants:
    - yolo26n_seg_w16a16_mpk
    - yolo26m_seg_w8a8_mpk
  cpp:
    enabled: false
    requires_rtsp: true
    models:
    - yolo26m_seg_w16a16_mpk
    - yolo_v8n_seg
    variants:
    - yolo26n_seg_w16a16_mpk
    - yolo26m_seg_w8a8_mpk
