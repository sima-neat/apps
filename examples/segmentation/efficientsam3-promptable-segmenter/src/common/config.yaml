# EfficientSAM3 segmentation of what a text prompt names in one RTSP stream, shown in Insight.
model:
  # Segmentation model package; the text encoder, efficientsam3_text_encoder_mpk.tar.gz, must
  # sit next to it. A relative path starts at this file.
  path: ../../../../../models/efficientsam3_mpk.tar.gz

input:
  source: rtsp://<rtsp-source-ip>:<port>/<stream-name>  # The RTSP URL.
  codec: h264                   # h264 or h265.
  width: 0                      # 0 reads the stream's frame size and rate with a probe.
  height: 0                     # Set them only for a stream that does not report them.
  fps: 0
  rtsp:
    tcp: true                   # Receive RTSP over TCP.
    latency_ms: 100             # RTSP jitter buffer.

inference:
  frames: 0                     # Frames to segment before stopping; 0 runs until stopped.
  # Lowest instance score (query probability x presence). EfficientSAM3 scores objects it finds
  # about 0.3 to 0.8, and keeps a prompt that names nothing in view below 0.1.
  min_score: 0.30
  max_detections: 20            # Instances kept per frame.

output:
  insight:
    host: <insight-host-ip>     # Machine running Insight.
    video_port_base: 9000       # Insight video port.
    metadata_port_base: 9100    # Insight metadata port.

app:
  # What to segment: a short noun phrase, such as "red car" or "traffic sign", of at most 14
  # CLIP tokens (about 10 words). A longer prompt fails at startup.
  prompt: person
  mask_threshold: 0.50          # Mask probability at which a pixel belongs to the instance.
