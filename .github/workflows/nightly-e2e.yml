name: Apps Nightly Integration

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch to rebuild and test without publishing.
        required: true
        default: develop
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ inputs.branch || 'develop' }}
  cancel-in-progress: false

jobs:
  integration:
    name: Rebuild and test Apps
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPS_BRANCH: ${{ inputs.branch || 'develop' }}
      NIGHTLY_REQUEST: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Dispatch on develop so the shared Vulcan workflows read its source,
      # SDK manifest and Modalix runner requirements, rather than main's.
      - name: Start nightly Vulcan build and tests
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vulcan-ci.yml --ref "${APPS_BRANCH}" \
            -f nightly=true -f nightly_request="${NIGHTLY_REQUEST}"

          expected_title="Apps Nightly Integration ${APPS_BRANCH} (${NIGHTLY_REQUEST})"
          for attempt in {1..30}; do
            run_id="$(gh run list --workflow vulcan-ci.yml \
              --branch "${APPS_BRANCH}" --event workflow_dispatch --limit 100 \
              --json databaseId,displayTitle \
              | jq -r --arg title "${expected_title}" \
                '[.[] | select(.displayTitle == $title)][0].databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              echo "Vulcan nightly integration: ${run_url}"
              echo "[Vulcan nightly integration](${run_url})" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "Waiting for the dispatched run to appear (${attempt}/30)."
            sleep 5
          done
          echo "Could not find the dispatched nightly integration run." >&2
          exit 1

      - name: Wait for build and test result
        env:
          NIGHTLY_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "${NIGHTLY_RUN_ID}" --interval 30 --exit-status

      - name: Cancel dispatched run when nightly is cancelled
        if: ${{ cancelled() && steps.dispatch.outputs.run_id != '' }}
        env:
          NIGHTLY_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run cancel "${NIGHTLY_RUN_ID}"
