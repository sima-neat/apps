name: Apps Nightly E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch artifact to test"
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  resolve-vulcan-config:
    name: Resolve Vulcan Config
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: production

  resolve-test-runner:
    name: Resolve Test Runner
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main

  modalix-nightly-e2e:
    needs:
      - resolve-vulcan-config
      - resolve-test-runner
    runs-on:
      group: ${{ needs.resolve-test-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix]
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main", "develop"]') || fromJSON(format('["{0}"]', inputs.branch)) }}
    env:
      ARTIFACT_BASE_URL: ${{ needs.resolve-vulcan-config.outputs.artifact_base_url }}
      VULCAN_ENV: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}

    steps:
      - name: Checkout matching Apps source
        uses: actions/checkout@v5
        with:
          clean: true
          ref: ${{ matrix.branch }}

      - name: Resolve exact Apps artifact
        run: |
          branch_key="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${{ matrix.branch }}")"
          artifact_tag="$(curl -fsSL "${ARTIFACT_BASE_URL%/}/apps/${branch_key}/latest.tag" | tr -d '[:space:]')"
          if [[ -z "${artifact_tag}" ]]; then
            echo "latest.tag is empty for Apps branch ${{ matrix.branch }}" >&2
            exit 1
          fi
          echo "APPS_ARTIFACT_BRANCH_KEY=${branch_key}" >> "${GITHUB_ENV}"
          echo "APPS_ARTIFACT_TAG=${artifact_tag}" >> "${GITHUB_ENV}"

      - name: Install exact Apps runtime
        run: |
          runtime_dir="$(scripts/ci/install_apps_runtime_from_vulcan.sh \
            --env "${VULCAN_ENV}" \
            --target "apps@${{ matrix.branch }}:${APPS_ARTIFACT_TAG}" \
            --install-dir _nightly-test/install \
            --force)"
          echo "APPS_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"

      - name: Overlay matching internal tests
        run: |
          test_archive="${RUNNER_TEMP}/neat-apps-tests.tar.gz"
          curl -fsSL \
            "${ARTIFACT_BASE_URL%/}/apps/${APPS_ARTIFACT_BRANCH_KEY}/${APPS_ARTIFACT_TAG}/neat-apps-tests.tar.gz" \
            -o "${test_archive}"
          scripts/ci/overlay_apps_tests.sh "${test_archive}" "${APPS_RUNTIME_DIR}"

      - name: Locate pyneat
        run: |
          if [[ -f /media/nvme/pyneat/bin/activate && -x /media/nvme/pyneat/bin/python3 ]]; then
            echo "PYNEAT_ACTIVATE=/media/nvme/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=/media/nvme/pyneat/bin/python3" >> "${GITHUB_ENV}"
          elif [[ -f "${HOME}/pyneat/bin/activate" && -x "${HOME}/pyneat/bin/python3" ]]; then
            echo "PYNEAT_ACTIVATE=${HOME}/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=${HOME}/pyneat/bin/python3" >> "${GITHUB_ENV}"
          else
            echo "pyneat virtual environment not found under /media/nvme/pyneat or ${HOME}/pyneat" >&2
            exit 1
          fi

      - name: Install Python test dependencies
        run: |
          source "${PYNEAT_ACTIVATE}"
          echo "Using Python test interpreter: ${PYTHON_TEST_BIN}"
          "${PYTHON_TEST_BIN}" -m pip install pytest "numpy<2" "opencv-python-headless<4.12" PyYAML

      - name: Run activated Apps e2e tests
        env:
          SIMANEAT_TEST_RTSP_H264_URL: ${{ vars.SIMANEAT_TEST_RTSP_H264_URL }}
          SIMANEAT_TEST_RTSP_H264_URLS: ${{ vars.SIMANEAT_TEST_RTSP_H264_URLS }}
          SIMANEAT_TEST_RTSP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URL }}
          SIMANEAT_TEST_RTSP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URLS }}
          SIMANEAT_TEST_HTTP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URL }}
          SIMANEAT_TEST_HTTP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URLS }}
        run: |
          if [[ -x /usr/bin/fix_devkit_runtime.sh ]]; then
            /usr/bin/fix_devkit_runtime.sh || echo "/usr/bin/fix_devkit_runtime.sh failed; continuing with existing devkit runtime state."
          fi
          cd "${APPS_RUNTIME_DIR}"
          source "${PYNEAT_ACTIVATE}"
          ./tests/test.sh --e2e --strict

      - name: Cleanup Nightly workspace
        if: ${{ always() }}
        run: |
          rm -rf _nightly-test
          rm -f "${RUNNER_TEMP}/neat-apps-tests.tar.gz"
