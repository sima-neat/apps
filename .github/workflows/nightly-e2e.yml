name: Apps Nightly E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch artifact to install. Runner selection uses the workflow run ref."
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  resolve-test-runner:
    name: Resolve Test Runner
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main

  modalix-nightly-e2e:
    if: github.event_name == 'schedule'
    needs: resolve-test-runner
    runs-on:
      group: ${{ needs.resolve-test-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix]
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - develop

    steps:
      - name: Install apps runtime for latest branch build
        run: |
          wget -O /tmp/install-neat-apps-from-a-branch.sh https://apps.sima-neat.com/tools/install-neat-apps.sh
          bash /tmp/install-neat-apps-from-a-branch.sh "${{ matrix.branch }}"

      - name: Locate pyneat
        shell: bash
        run: |
          if [[ -f /media/nvme/pyneat/bin/activate && -x /media/nvme/pyneat/bin/python3 ]]; then
            echo "PYNEAT_ACTIVATE=/media/nvme/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=/media/nvme/pyneat/bin/python3" >> "${GITHUB_ENV}"
          elif [[ -f "${HOME}/pyneat/bin/activate" && -x "${HOME}/pyneat/bin/python3" ]]; then
            echo "PYNEAT_ACTIVATE=${HOME}/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=${HOME}/pyneat/bin/python3" >> "${GITHUB_ENV}"
          else
            echo "pyneat virtual environment not found under /media/nvme/pyneat or ${HOME}/pyneat" >&2
            exit 1
          fi

      - name: Install Python test dependencies
        shell: bash
        run: |
          source "${PYNEAT_ACTIVATE}"
          echo "Using Python test interpreter: ${PYTHON_TEST_BIN}"
          "${PYTHON_TEST_BIN}" -m pip install pytest "numpy<2" "opencv-python-headless<4.12" PyYAML

      - name: Run nightly Python e2e tests from installed apps runtime
        shell: bash
        env:
          SIMANEAT_TEST_RTSP_H264_URL: ${{ vars.SIMANEAT_TEST_RTSP_H264_URL }}
          SIMANEAT_TEST_RTSP_H264_URLS: ${{ vars.SIMANEAT_TEST_RTSP_H264_URLS }}
          SIMANEAT_TEST_RTSP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URL }}
          SIMANEAT_TEST_RTSP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URLS }}
          SIMANEAT_TEST_HTTP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URL }}
          SIMANEAT_TEST_HTTP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URLS }}
        run: |
          if [[ -x /usr/bin/fix_devkit_runtime.sh ]]; then
            /usr/bin/fix_devkit_runtime.sh || echo "/usr/bin/fix_devkit_runtime.sh failed; continuing with existing devkit runtime state."
          else
            echo "/usr/bin/fix_devkit_runtime.sh not found; continuing with existing devkit runtime state."
          fi
          cd neat-apps/neat-apps-runtime
          source "${PYNEAT_ACTIVATE}"
          scope_file="$(mktemp)"
          "${PYTHON_TEST_BIN}" tests/utils/codec_e2e_scope.py --scope-file examples --output "${scope_file}"
          SIMANEAT_APPS_TEST_SCOPE_FILE="${scope_file}" ./tests/test.sh --e2e --python --strict

      - name: Run nightly C++ e2e tests from installed apps runtime
        shell: bash
        env:
          SIMANEAT_TEST_RTSP_H264_URL: ${{ vars.SIMANEAT_TEST_RTSP_H264_URL }}
          SIMANEAT_TEST_RTSP_H264_URLS: ${{ vars.SIMANEAT_TEST_RTSP_H264_URLS }}
          SIMANEAT_TEST_RTSP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URL }}
          SIMANEAT_TEST_RTSP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URLS }}
          SIMANEAT_TEST_HTTP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URL }}
          SIMANEAT_TEST_HTTP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URLS }}
        run: |
          if [[ -x /usr/bin/fix_devkit_runtime.sh ]]; then
            /usr/bin/fix_devkit_runtime.sh || echo "/usr/bin/fix_devkit_runtime.sh failed; continuing with existing devkit runtime state."
          else
            echo "/usr/bin/fix_devkit_runtime.sh not found; continuing with existing devkit runtime state."
          fi
          cd neat-apps/neat-apps-runtime
          source "${PYNEAT_ACTIVATE}"
          scope_file="$(mktemp)"
          "${PYTHON_TEST_BIN}" tests/utils/codec_e2e_scope.py --scope-file examples --output "${scope_file}"
          SIMANEAT_APPS_TEST_SCOPE_FILE="${scope_file}" ./tests/test.sh --e2e --cpp --strict

  modalix-manual-e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve-test-runner
    runs-on:
      group: ${{ needs.resolve-test-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix]

    steps:
      - name: Install apps runtime for latest branch build
        run: |
          wget -O /tmp/install-neat-apps-from-a-branch.sh https://apps.sima-neat.com/tools/install-neat-apps.sh
          bash /tmp/install-neat-apps-from-a-branch.sh "${{ inputs.branch }}"

      - name: Locate pyneat
        shell: bash
        run: |
          if [[ -f /media/nvme/pyneat/bin/activate && -x /media/nvme/pyneat/bin/python3 ]]; then
            echo "PYNEAT_ACTIVATE=/media/nvme/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=/media/nvme/pyneat/bin/python3" >> "${GITHUB_ENV}"
          elif [[ -f "${HOME}/pyneat/bin/activate" && -x "${HOME}/pyneat/bin/python3" ]]; then
            echo "PYNEAT_ACTIVATE=${HOME}/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=${HOME}/pyneat/bin/python3" >> "${GITHUB_ENV}"
          else
            echo "pyneat virtual environment not found under /media/nvme/pyneat or ${HOME}/pyneat" >&2
            exit 1
          fi

      - name: Install Python test dependencies
        shell: bash
        run: |
          source "${PYNEAT_ACTIVATE}"
          echo "Using Python test interpreter: ${PYTHON_TEST_BIN}"
          "${PYTHON_TEST_BIN}" -m pip install pytest "numpy<2" "opencv-python-headless<4.12" PyYAML

      - name: Run manual Python e2e tests from installed apps runtime
        shell: bash
        env:
          SIMANEAT_TEST_RTSP_H264_URL: ${{ vars.SIMANEAT_TEST_RTSP_H264_URL }}
          SIMANEAT_TEST_RTSP_H264_URLS: ${{ vars.SIMANEAT_TEST_RTSP_H264_URLS }}
          SIMANEAT_TEST_RTSP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URL }}
          SIMANEAT_TEST_RTSP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URLS }}
          SIMANEAT_TEST_HTTP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URL }}
          SIMANEAT_TEST_HTTP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URLS }}
        run: |
          if [[ -x /usr/bin/fix_devkit_runtime.sh ]]; then
            /usr/bin/fix_devkit_runtime.sh || echo "/usr/bin/fix_devkit_runtime.sh failed; continuing with existing devkit runtime state."
          else
            echo "/usr/bin/fix_devkit_runtime.sh not found; continuing with existing devkit runtime state."
          fi
          cd neat-apps/neat-apps-runtime
          source "${PYNEAT_ACTIVATE}"
          scope_file="$(mktemp)"
          "${PYTHON_TEST_BIN}" tests/utils/codec_e2e_scope.py --scope-file examples --output "${scope_file}"
          SIMANEAT_APPS_TEST_SCOPE_FILE="${scope_file}" ./tests/test.sh --e2e --python --strict

      - name: Run manual C++ e2e tests from installed apps runtime
        shell: bash
        env:
          SIMANEAT_TEST_RTSP_H264_URL: ${{ vars.SIMANEAT_TEST_RTSP_H264_URL }}
          SIMANEAT_TEST_RTSP_H264_URLS: ${{ vars.SIMANEAT_TEST_RTSP_H264_URLS }}
          SIMANEAT_TEST_RTSP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URL }}
          SIMANEAT_TEST_RTSP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_RTSP_MJPEG_URLS }}
          SIMANEAT_TEST_HTTP_MJPEG_URL: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URL }}
          SIMANEAT_TEST_HTTP_MJPEG_URLS: ${{ vars.SIMANEAT_TEST_HTTP_MJPEG_URLS }}
        run: |
          if [[ -x /usr/bin/fix_devkit_runtime.sh ]]; then
            /usr/bin/fix_devkit_runtime.sh || echo "/usr/bin/fix_devkit_runtime.sh failed; continuing with existing devkit runtime state."
          else
            echo "/usr/bin/fix_devkit_runtime.sh not found; continuing with existing devkit runtime state."
          fi
          cd neat-apps/neat-apps-runtime
          source "${PYNEAT_ACTIVATE}"
          scope_file="$(mktemp)"
          "${PYTHON_TEST_BIN}" tests/utils/codec_e2e_scope.py --scope-file examples --output "${scope_file}"
          SIMANEAT_APPS_TEST_SCOPE_FILE="${scope_file}" ./tests/test.sh --e2e --cpp --strict
