name: Temporary SSD Model Validation

on:
  push:
    branches:
      - feat/ssd-recipe-validation-and-coverage
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing the compiled model archives
        required: true
        default: ssd-model-validation-20260802
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve-test-runner:
    name: Resolve Test Runner
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-modalix-runner.yml@main

  validate-models:
    name: Validate SSD models on Modalix
    needs: resolve-test-runner
    runs-on:
      group: ${{ needs.resolve-test-runner.outputs.modalix_runner_group }}
      labels: [self-hosted, Linux, ARM64, modalix]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Fix devkit runtime
        shell: bash
        run: |
          if [[ -x /usr/bin/fix_devkit_runtime.sh ]]; then
            /usr/bin/fix_devkit_runtime.sh || echo "/usr/bin/fix_devkit_runtime.sh failed; continuing with existing devkit runtime state."
          else
            echo "/usr/bin/fix_devkit_runtime.sh not found; continuing with existing devkit runtime state."
          fi

      - name: Install exact Apps and Core runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIMA_NEAT_ENV: ${{ vars.VULCAN_ENV || 'production' }}
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          api_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              curl -fsSL "${api_headers[@]}" --get \
                --data-urlencode "branch=${branch}" --data 'per_page=50' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vulcan-ci.yml/runs" \
                | TARGET_SHA="${GITHUB_SHA}" python3 -c \
                  'import json, os, sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(next((run["id"] for run in runs if run.get("head_sha") == os.environ["TARGET_SHA"]), ""))'
            )"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            if [[ "${attempt}" -eq 60 ]]; then
              echo "Could not find the Vulcan CI run for ${GITHUB_SHA} after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Vulcan CI run for ${GITHUB_SHA} is not registered yet; retrying in 10 seconds" >&2
            sleep 10
          done

          for attempt in $(seq 1 60); do
            rm -rf _ssd-validation/build-artifacts
            mkdir -p _ssd-validation/build-artifacts
            artifact_url="$(
              curl -fsSL "${api_headers[@]}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
                | python3 -c \
                  'import json, sys; artifacts=json.load(sys.stdin).get("artifacts", []); print(next((item["archive_download_url"] for item in artifacts if item.get("name") == "neat-apps-build"), ""))'
            )"
            if [[ -n "${artifact_url}" ]]; then
              artifact_zip="${RUNNER_TEMP}/neat-apps-build.zip"
              if curl -fsSL -L "${api_headers[@]}" "${artifact_url}" -o "${artifact_zip}"; then
                python3 -m zipfile -e "${artifact_zip}" _ssd-validation/build-artifacts
                break
              fi
            fi
            if [[ "${attempt}" -eq 60 ]]; then
              echo "Apps build artifact was unavailable after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Apps build artifact is not uploaded yet; retrying in 20 seconds" >&2
            sleep 20
          done

          mapfile -t runtime_archives < <(
            find _ssd-validation/build-artifacts -maxdepth 1 -type f \
              -name 'neat-apps-*.tar.gz' ! -name 'neat-apps-tests.tar.gz' -print | sort
          )
          if [[ "${#runtime_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Apps runtime archive" >&2
            exit 1
          fi
          runtime_archive="${runtime_archives[0]}"
          core_target_ref="$(
            tar -xOzf "${runtime_archive}" prebuilt-apps/deps/neat-core.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["neat-core"]["ref"])'
          )"
          core_target_spec="$(
            tar -xOzf "${runtime_archive}" prebuilt-apps/deps/neat-core.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["neat-core"]["spec"])'
          )"
          echo "CORE_TARGET_SPEC=${core_target_spec}" >> "${GITHUB_ENV}"

          cli_installer="${RUNNER_TEMP}/sima-cli-install.py"
          curl -fsSL https://artifacts.sima-neat.com/tools/sima-cli-install.py -o "${cli_installer}"
          python3 "${cli_installer}" v2.1.15 --noninteractive
          export PATH="${HOME}/.sima-cli/.venv/bin:${PATH}"
          export SIMA_CLI_CHECK_FOR_UPDATE=0
          echo "${HOME}/.sima-cli/.venv/bin" >> "${GITHUB_PATH}"

          # Do not replace packages on the shared Modalix runner. Resolve the exact
          # minimal Core package with sima-cli, then stage only its runtime payloads.
          # This keeps the board immutable and avoids an unrelated simaai-memory
          # downgrade transaction while still exercising the PR's exact libraries.
          core_target="core@${core_target_ref}:${core_target_spec}"
          metadata_resolution="$(
            sima-cli neat install --env "${SIMA_NEAT_ENV}" -t minimal --json "${core_target}" \
              | python3 -c 'import sys; text=sys.stdin.read(); start=text.find("{"); assert start >= 0, text; print(text[start:])'
          )"
          core_downloads="${GITHUB_WORKSPACE}/_ssd-validation/core-downloads"
          core_stage="${GITHUB_WORKSPACE}/_ssd-validation/core-stage"
          mkdir -p "${core_downloads}" "${core_stage}"
          METADATA_RESOLUTION="${metadata_resolution}" \
            CORE_DOWNLOADS="${core_downloads}" python3 - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          resolution = json.loads(os.environ["METADATA_RESOLUTION"])
          metadata_url = resolution["metadata_url"]
          with urlopen(metadata_url) as response:
              metadata = json.load(response)
          patterns = {
              "core": "sima-neat-*-Linux-core.deb",
              "gst_plugins": "neat-gst-plugins_*_arm64.deb",
              "runtime": "neat-runtime_*_arm64.deb",
              "appcomplex": "neat-appcomplex_*_arm64.deb",
              "lmm": "sima-lmm-*-Linux-core.deb",
              "pyneat": "pyneat-*-cp311-cp311-linux_aarch64.whl",
          }
          resources = metadata.get("resources", [])
          selected = {}
          for role, pattern in patterns.items():
              matches = [name for name in resources if fnmatch.fnmatchcase(name, pattern)]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{role}: expected one resource matching {pattern}, found {matches}"
                  )
              selected[role] = matches[0]

          output = Path(os.environ["CORE_DOWNLOADS"])
          checksums = metadata.get("resources-checksum", {})
          base_url = metadata_url.rsplit("/", 1)[0]
          for role, name in selected.items():
              destination = output / name
              digest = hashlib.sha256()
              with urlopen(f"{base_url}/{quote(name, safe='')}") as response, destination.open("wb") as stream:
                  while chunk := response.read(1024 * 1024):
                      stream.write(chunk)
                      digest.update(chunk)
              expected = checksums.get(name)
              if expected and digest.hexdigest() != expected:
                  destination.unlink(missing_ok=True)
                  raise SystemExit(f"{name}: artifact digest does not match metadata")
              print(f"{role}: {name}")
          PY

          while IFS= read -r deb; do
            dpkg-deb -x "${deb}" "${core_stage}"
          done < <(find "${core_downloads}" -maxdepth 1 -type f -name '*.deb' -print | sort)
          mapfile -t pyneat_wheels < <(
            find "${core_downloads}" -maxdepth 1 -type f -name 'pyneat-*.whl' -print
          )
          if [[ "${#pyneat_wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one staged pyneat wheel" >&2
            exit 1
          fi

          # Modalix runners are not all provisioned with the RTSP server runtime
          # required by pyneat. Keep the board immutable: download the distro package
          # and extract it beside the exact Core libraries instead of installing it.
          if ! find /lib /usr/lib -type f -name 'libgstrtspserver-1.0.so.0*' \
              -print -quit 2>/dev/null | grep -q .; then
            (
              cd "${core_downloads}"
              apt-get download libgstrtspserver-1.0-0
            )
            mapfile -t rtsp_packages < <(
              find "${core_downloads}" -maxdepth 1 -type f \
                -name 'libgstrtspserver-1.0-0_*.deb' -print
            )
            if [[ "${#rtsp_packages[@]}" -ne 1 ]]; then
              echo "Expected exactly one downloaded RTSP server runtime package" >&2
              exit 1
            fi
            dpkg-deb -x "${rtsp_packages[0]}" "${core_stage}"
          fi

          exact_lib="${core_stage}/usr/lib"
          exact_multiarch="${core_stage}/usr/lib/aarch64-linux-gnu"
          exact_runtime="${core_stage}/usr/lib/aarch64-linux-gnu/neat/runtime"
          exact_plugins="${core_stage}/usr/lib/aarch64-linux-gnu/neat/gst-plugins"
          exact_gst="${core_stage}/usr/lib/aarch64-linux-gnu/gstreamer-1.0"
          test -f "${exact_lib}/libsima_neat.so.2.1.3"
          test -f "${exact_runtime}/libsimaai_genboxdecode.so"
          test -f "${exact_plugins}/libneatobjectdecode.so"
          {
            echo "EXACT_CORE_ROOT=${core_stage}"
            echo "PYNEAT_WHEEL=${pyneat_wheels[0]}"
            echo "LD_LIBRARY_PATH=${exact_lib}:${exact_multiarch}:${exact_runtime}:${exact_plugins}:${LD_LIBRARY_PATH:-}"
            echo "GST_PLUGIN_PATH=${exact_gst}:${exact_plugins}:${GST_PLUGIN_PATH:-}"
            echo "GST_REGISTRY=${GITHUB_WORKSPACE}/_ssd-validation/gstreamer-registry.bin"
          } >> "${GITHUB_ENV}"

          mkdir -p _ssd-validation/runtime
          tar -xzf "${runtime_archive}" -C _ssd-validation/runtime
          runtime_dir="${GITHUB_WORKSPACE}/_ssd-validation/runtime/prebuilt-apps"
          if [[ ! -d "${runtime_dir}" ]]; then
            echo "Apps runtime was not extracted to ${runtime_dir}" >&2
            exit 1
          fi
          echo "APPS_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"

      - name: Locate Python runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /media/nvme/pyneat/bin/activate && -x /media/nvme/pyneat/bin/python3 ]]; then
            echo "PYNEAT_ACTIVATE=/media/nvme/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=/media/nvme/pyneat/bin/python3" >> "${GITHUB_ENV}"
          elif [[ -f "${HOME}/pyneat/bin/activate" && -x "${HOME}/pyneat/bin/python3" ]]; then
            echo "PYNEAT_ACTIVATE=${HOME}/pyneat/bin/activate" >> "${GITHUB_ENV}"
            echo "PYTHON_TEST_BIN=${HOME}/pyneat/bin/python3" >> "${GITHUB_ENV}"
          else
            echo "pyneat virtual environment was not found" >&2
            exit 1
          fi

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "${PYNEAT_ACTIVATE}"
          python_site="${GITHUB_WORKSPACE}/_ssd-validation/python-site"
          mkdir -p "${python_site}"
          "${PYTHON_TEST_BIN}" -m pip install --target "${python_site}" --upgrade \
            --no-deps "${PYNEAT_WHEEL}"
          "${PYTHON_TEST_BIN}" -m pip install --target "${python_site}" --upgrade \
            "numpy<2" "opencv-python-headless<4.12" PyYAML
          echo "PYTHONPATH=${python_site}:${PYTHONPATH:-}" >> "${GITHUB_ENV}"
          PYTHONPATH="${python_site}:${PYTHONPATH:-}" \
            "${PYTHON_TEST_BIN}" -c \
              "import pyneat; print('Using job-local pyneat:', pyneat.__file__)"

      - name: Download compiled model archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _ssd-validation/models
          release_tag="${{ inputs.release_tag || 'ssd-model-validation-20260802' }}"
          api_headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          while IFS=$'\t' read -r asset_name asset_url; do
            case "${asset_name}" in
              ssd_mobilenet_v1_heads_mpk.tar.gz|ssd_mobilenet_v3_heads_mpk.tar.gz)
                curl -fsSL -L \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/octet-stream" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${asset_url}" -o "_ssd-validation/models/${asset_name}"
                ;;
            esac
          done < <(
            curl -fsSL "${api_headers[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | RELEASE_TAG="${release_tag}" python3 -c \
                'import json, os, sys; releases=json.load(sys.stdin); release=next((item for item in releases if item.get("tag_name") == os.environ["RELEASE_TAG"]), {}); [print(asset["name"], asset["url"], sep="\t") for asset in release.get("assets", [])]'
          )

      - name: Validate archive deployment contract
        shell: bash
        run: |
          "${PYTHON_TEST_BIN}" - <<'PY'
          import tarfile
          from pathlib import Path

          models = Path("_ssd-validation/models")
          archives = sorted(models.glob("*.tar.gz"))
          if len(archives) != 2:
              raise SystemExit(f"expected two model archives, found {len(archives)}")
          for archive in archives:
              with tarfile.open(archive, "r:gz") as bundle:
                  names = bundle.getnames()
              elfs = [name for name in names if name.endswith(".elf")]
              shared_objects = [name for name in names if name.endswith(".so")]
              manifests = [name for name in names if name.endswith("_mpk.json")]
              embedded_preproc = [name for name in names if name.endswith("_preproc.json")]
              if len(elfs) != 1 or shared_objects or len(manifests) != 1 or embedded_preproc:
                  raise SystemExit(
                      f"{archive.name}: expected one ELF, no SO, one MPK manifest; "
                      f"and no baked preprocessor; got elfs={elfs}, so={shared_objects}, "
                      f"manifests={manifests}, preproc={embedded_preproc}"
                  )
              print(f"{archive.name}: {elfs[0]}")
          PY

      - name: Run C++ and Python Apps E2E and performance gate
        shell: bash
        run: |
          set -euo pipefail
          source "${PYNEAT_ACTIVATE}"

          cpp_binary="$(find "${APPS_RUNTIME_DIR}/examples" -type f \
            -name ssd-mobilenet-object-detector -perm -111 -print -quit)"
          python_main="$(find "${APPS_RUNTIME_DIR}/examples" -type f \
            -path '*/ssd-mobilenet-object-detector/src/python/main.py' -print -quit)"
          labels="$(find "${APPS_RUNTIME_DIR}/examples" -type f \
            -path '*/ssd-mobilenet-object-detector/src/common/coco_labels.txt' -print -quit)"
          mapfile -t source_images < <(
            find "${GITHUB_WORKSPACE}/assets/datasets-test/coco" -maxdepth 1 \
              -type f -iname '*.jpg' -print | sort
          )
          source_image="${source_images[0]:-}"
          test -x "${cpp_binary}"
          test -f "${python_main}"
          test -f "${labels}"
          test -f "${source_image}"
          ldd "${cpp_binary}" | tee _ssd-validation/cpp-runtime-libraries.txt
          ldd "${EXACT_CORE_ROOT}/usr/lib/aarch64-linux-gnu/neat/gst-plugins/libneatobjectdecode.so" \
            | tee _ssd-validation/boxdecode-runtime-libraries.txt
          grep -Fq "${EXACT_CORE_ROOT}/usr/lib/libsima_neat.so" \
            _ssd-validation/cpp-runtime-libraries.txt
          grep -Fq "${EXACT_CORE_ROOT}/usr/lib/aarch64-linux-gnu/libsima_lmm_runtime.so" \
            _ssd-validation/cpp-runtime-libraries.txt
          grep -Fq "${EXACT_CORE_ROOT}/usr/lib/aarch64-linux-gnu/neat/runtime" \
            _ssd-validation/boxdecode-runtime-libraries.txt

          input_dir="${GITHUB_WORKSPACE}/_ssd-validation/input"
          mkdir -p "${input_dir}"
          cp "${source_image}" "${input_dir}/"

          run_model() {
            local model_name="$1"
            local frame="$2"
            local archive="${GITHUB_WORKSPACE}/_ssd-validation/models/${model_name}_mpk.tar.gz"
            local work="${GITHUB_WORKSPACE}/_ssd-validation/results/${model_name}"
            mkdir -p "${work}"

            MODEL_ARCHIVE="${archive}" MODEL_FRAME="${frame}" LABELS="${labels}" \
              INPUT_DIR="${input_dir}" WORK_DIR="${work}" \
              "${PYTHON_TEST_BIN}" - <<'PY'
          import os
          from pathlib import Path
          import yaml

          work = Path(os.environ["WORK_DIR"])
          base = {
              "model": {
                  "path": os.environ["MODEL_ARCHIVE"],
                  "frame": int(os.environ["MODEL_FRAME"]),
                  "labels": os.environ["LABELS"],
              },
              "io": {
                  "input_dir": os.environ["INPUT_DIR"],
                  "output_dir": str(work / "output"),
              },
              "decode": {
                  "score_threshold": 0.55,
                  "nms_iou": 0.60,
                  "max_detections": 100,
              },
              "runtime": {"timeout_ms": 60000, "num_runs": 1, "profile": False},
              "output": {"overlay": True},
          }
          for language in ("cpp", "python"):
              config = dict(base)
              config["io"] = dict(base["io"])
              config["io"]["output_dir"] = str(work / f"{language}-output")
              config["io"]["detections_json"] = str(work / f"{language}-detections.json")
              (work / f"{language}.yaml").write_text(yaml.safe_dump(config), encoding="utf-8")
          profile = dict(base)
          profile["output"] = {"overlay": False}
          profile["runtime"] = {"timeout_ms": 60000, "num_runs": 1000, "profile": True}
          (work / "profile.yaml").write_text(yaml.safe_dump(profile), encoding="utf-8")
          PY

            (
              cd "${APPS_RUNTIME_DIR}"
              "${cpp_binary}" --config "${work}/cpp.yaml" | tee "${work}/cpp.log"
              "${PYTHON_TEST_BIN}" "${python_main}" --config "${work}/python.yaml" \
                | tee "${work}/python.log"
            )

            MODEL_NAME="${model_name}" WORK_DIR="${work}" "${PYTHON_TEST_BIN}" - <<'PY'
          import json
          import os
          from pathlib import Path

          def iou(a, b):
              inter_w = max(0.0, min(a[2], b[2]) - max(a[0], b[0]))
              inter_h = max(0.0, min(a[3], b[3]) - max(a[1], b[1]))
              intersection = inter_w * inter_h
              union = (
                  max(0.0, a[2] - a[0]) * max(0.0, a[3] - a[1])
                  + max(0.0, b[2] - b[0]) * max(0.0, b[3] - b[1])
                  - intersection
              )
              return intersection / union if union > 0.0 else 0.0

          source_golden = {
              "ssd_mobilenet_v1_heads": [
                  {"class_id": 62, "box": [91.61, 154.68, 237.76, 375.46]},
                  {"class_id": 63, "box": [204.36, 174.56, 613.55, 357.82]},
              ],
              "ssd_mobilenet_v3_heads": [
                  {"class_id": 63, "box": [200.28, 162.25, 602.21, 353.08]},
                  {"class_id": 62, "box": [95.86, 150.09, 229.94, 376.10]},
              ],
          }
          work = Path(os.environ["WORK_DIR"])
          expected = source_golden[os.environ["MODEL_NAME"]]
          reports = {}
          for language in ("cpp", "python"):
              overlays = list((work / f"{language}-output").glob("*.png"))
              if len(overlays) != 1 or overlays[0].stat().st_size == 0:
                  raise SystemExit(
                      f"{language}: expected one non-empty generated overlay, found {overlays}"
                  )
              report = json.loads((work / f"{language}-detections.json").read_text())
              images = report.get("images") or []
              if len(images) != 1 or not images[0].get("detections"):
                  raise SystemExit(f"{language}: expected one image with non-empty detections")
              actual = images[0]["detections"]
              if len(actual) != len(expected):
                  raise SystemExit(
                      f"{language}: expected exactly {len(expected)} visible detections, "
                      f"found {len(actual)}: {actual}"
                  )
              used = set()
              for golden in expected:
                  choices = [
                      (iou(golden["box"], item["box"]), index)
                      for index, item in enumerate(actual)
                      if index not in used and item["class_id"] == golden["class_id"]
                  ]
                  if not choices:
                      raise SystemExit(
                          f"{language}: source class {golden['class_id']} has no candidate"
                      )
                  overlap, index = max(choices)
                  if overlap < 0.85:
                      raise SystemExit(
                          f"{language}: source class {golden['class_id']} has IoU {overlap:.4f}"
                      )
                  print(
                      f"{language}: class={golden['class_id']} score="
                      f"{actual[index]['score']:.6f} IoU={overlap:.6f} "
                      f"box={actual[index]['box']}"
                  )
                  used.add(index)
              print(
                  f"{language}: matched {len(expected)} source boxes; "
                  f"{len(images[0]['detections'])} total detections"
              )
              reports[language] = actual
          if reports["cpp"] != reports["python"]:
              raise SystemExit(
                  "C++ and Python detections differ: "
                  f"cpp={reports['cpp']} python={reports['python']}"
              )
          PY

            (
              cd "${APPS_RUNTIME_DIR}"
              SIMA_BOXDECODE_PROFILE=1 SIMA_BOXDECODE_PROFILE_EVERY=1000 \
                SIMA_BOXDECODE_PROFILE_SKIP=2 \
                "${cpp_binary}" --config "${work}/profile.yaml" \
                | tee "${work}/profile.log"
            )

            PROFILE_LOG="${work}/profile.log" "${PYTHON_TEST_BIN}" - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path(os.environ["PROFILE_LOG"]).read_text(encoding="utf-8")
          matches = re.findall(
              r"\[boxdecode-profile\] frames=([0-9]+) skipped=([0-9]+) "
              r"avg_ms\{[^}]*total=([0-9.]+)\}.*?"
              r"window_ms\{samples=([0-9]+),p99=([0-9.]+),max=([0-9.]+)\}",
              text,
          )
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one backend BoxDecode profile window, got {matches}"
              )
          frames, skipped, mean, samples, p99, worst = matches[0]
          frames, skipped, samples = int(frames), int(skipped), int(samples)
          mean, p99, worst = float(mean), float(p99), float(worst)
          if (frames, skipped, samples) != (1000, 2, 1000):
              raise SystemExit(
                  "unexpected BoxDecode profile window: "
                  f"frames={frames} skipped={skipped} samples={samples}"
              )
          print(
              f"BoxDecode 1000-run latency: mean={mean:.6f} ms, "
              f"p99={p99:.6f} ms, max={worst:.6f} ms"
          )
          if worst >= 1.0:
              raise SystemExit(
                  f"BoxDecode every measured run must be <1 ms, got max={worst:.6f} ms"
              )
          PY
          }

          run_model ssd_mobilenet_v1_heads 300
          run_model ssd_mobilenet_v3_heads 320

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssd-model-validation-${{ github.run_id }}
          path: _ssd-validation/results/
          if-no-files-found: warn
          retention-days: 7
